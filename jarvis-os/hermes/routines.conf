# JARVIS OS — les routines d'Hermes (posées par routines.sh ; docs/hermes-deroule.md).
#
# Une routine par ligne : nom | état | horaire | skills | outils | consigne
#   nom     : lettres minuscules, chiffres et tirets ; routines.sh le préfixe par « jarvis- » chez Hermes
#   état    : actif | pause (pause : créée mais ne tourne pas)
#   horaire : cron à 5 champs, heure de Paris (minute heure jour-du-mois mois jour-de-la-semaine)
#   skills  : séparées par des virgules (dossier skills/ du kit)
#   outils  : « - » = ceux de toutes les routines (politique.yaml : mémoire, skills, serveur « jarvis ») ; sinon la
#             liste exacte, séparée par des virgules. Une routine qui lit le web a « web » et « jarvis-web », jamais
#             « jarvis » : elle ne voit ni mails, ni agenda, ni dossiers. Elle attend le jeton « Veilleur »
#             (relier-jarvis.sh --web) pour être posée.
# Le résultat part sur son Telegram ; « [SILENT] » n'envoie rien. Modèle : Sonnet (politique.yaml, cron.model).
# Changer une ligne puis relancer routines.sh : la routine est recréée ; une ligne retirée est supprimée.
#
# Modes (skill pilotage) : « en double » = à blanc, n'écrit que le Journal et l'État ; « en réel » = la routine du bot
# est en pause, Hermes la fait et rend compte dans JARVIS. Le mode écrit ici est celui d'une installation neuve ;
# la bascule se fait sur le serveur, sans toucher au dépôt : routines.sh --reel <nom> (retour : --double <nom>),
# puis routines.sh --lancer <nom> pour la première exécution réelle tout de suite.
# Routines de Grok Bot reprises le 26/11/2026 (sa décision : tout arrêté ou remplacé le jour même ; docs/hermes-deroule.md).
veille-du-matin | actif | 40 7 * * 1-5 | pilotage,veille-du-matin | - | Routine « Veille du matin » (reprise d'Iris). Fais-la en suivant tes skills pilotage et veille-du-matin, en mode « en double ».
bilan-hebdo | actif | 50 8 * * 1 | pilotage,bilan-hebdo | - | Routine « Bilan de la semaine » (remplace la Supervision et le Bilan du lundi d'Argus). Fais-la en suivant tes skills pilotage et bilan-hebdo, en mode « en double ».
reveil | actif | 15 9,13,18 * * * | pilotage,reveil | - | Routine « Réveil » (le courrier prioritaire d'Iris, les alertes de prix de Kairos, les lignes du Canal ; lancée aussi par JARVIS). Fais-la en suivant tes skills pilotage et reveil, en mode « en double ».
digest-ia | actif | 10 9 * * 1 | digest-ia | web,memory,skills,jarvis-web | Routine « Digest IA et .NET » (reprise d'Athéna). Fais-la en suivant ta skill digest-ia, en mode « en double ».
prix-suivis | actif | 0 9 * * * | prix-suivis | web,memory,skills,jarvis-web | Routine « Prix suivis » (reprise de Kairos). Fais-la en suivant ta skill prix-suivis, en mode « en double ».
sorties-du-week-end | actif | 0 19 * * 4 | sorties-du-week-end | web,memory,skills,jarvis-web | Routine « Sorties du week-end » (reprise d'Ulysse). Fais-la en suivant ta skill sorties-du-week-end, en mode « en double ».
