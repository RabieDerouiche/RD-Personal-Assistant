# JARVIS OS — les routines d'Hermes (posées par routines.sh ; docs/hermes-deroule.md).
#
# Une routine par ligne : nom | état | horaire | skills | consigne
#   nom     : lettres minuscules, chiffres et tirets ; routines.sh le préfixe par « jarvis- » chez Hermes
#   état    : actif | pause (pause : créée mais ne tourne pas)
#   horaire : cron à 5 champs, heure de Paris (minute heure jour-du-mois mois jour-de-la-semaine)
#   skills  : séparées par des virgules (dossier skills/ du kit)
# Le résultat part sur son Telegram ; « [SILENT] » n'envoie rien. Modèle : Sonnet (politique.yaml, cron.model).
# Changer une ligne puis relancer routines.sh : la routine est recréée ; une ligne retirée est supprimée.
#
# « En double » : la même routine tourne encore chez Grok Bot, qui reste la référence (skill pilotage).
supervision | actif | 50 8 * * 1,3,5 | pilotage,supervision | En double de la Supervision d'Argus. Fais la routine « Supervision » en suivant tes skills pilotage et supervision, en mode « en double ».
semaine-a-venir | actif | 10 18 * * 0 | pilotage,semaine-a-venir | En double de la « Semaine à venir » d'Iris. Fais la routine « Semaine à venir » en suivant tes skills pilotage et semaine-a-venir, en mode « en double ».
