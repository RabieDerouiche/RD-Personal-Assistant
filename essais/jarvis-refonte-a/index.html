<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#04060c">
<title>JARVIS · proposition A « Orbite »</title>
<!-- Maquette (26/11/2026) : refonte complète de JARVIS OS, proposition A « Orbite ». Le globe devient la navigation :
     un seul écran, ce qui tourne en orbite autour de lui, ce qui attend un oui en pile en bas, les domaines en secteurs du globe.
     Données inventées, rien n'est lu ni envoyé. « ?iphone » dans l'adresse simule les zones sûres d'un iPhone (captures). -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700&family=Oxanium:wght@500;600;700&family=Exo+2:wght@400;500;600;700&display=swap">
<style>
  :root { --bg: #04060c; --fg: #e6edf7; --muted: #a3b3ca; --line: rgba(125, 211, 252, .16); --line2: rgba(125, 211, 252, .32); --glass: rgba(13, 21, 40, .78); --glass2: rgba(30, 41, 59, .5);
    --c1: 56, 189, 248; --c2: 103, 232, 249; --c3: 168, 85, 247; --amb: 251, 191, 36; --red: 252, 129, 129; --vert: 110, 231, 183; --gris: 148, 163, 184;
    --display: 'Oxanium', 'Exo 2', system-ui, sans-serif; --sans: 'Exo 2', system-ui, -apple-system, sans-serif; --logo: 'Orbitron', 'Oxanium', sans-serif;
    --st: env(safe-area-inset-top, 0px); --sb: env(safe-area-inset-bottom, 0px); }
  :root.sim { --st: 47px; --sb: 34px; }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; margin: 0; background: #020308; }
  body { height: 100dvh; display: flex; align-items: center; justify-content: center; color: var(--fg); font: 500 15px/1.45 var(--sans); overflow: hidden; -webkit-font-smoothing: antialiased; -webkit-text-size-adjust: 100%; -webkit-tap-highlight-color: transparent; }
  button { font: inherit; color: inherit; cursor: pointer; -webkit-appearance: none; appearance: none; touch-action: manipulation; }
  button:focus-visible, input:focus-visible, [tabindex]:focus-visible { outline: 2px solid rgb(var(--c2)); outline-offset: 2px; }
  h1, h2, h3, p { margin: 0; }

  /* ---- le cadre : plein écran sur iPhone, centré sur un ordinateur ---- */
  .cadre { position: relative; width: 100%; max-width: 430px; height: 100%; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; overflow: hidden; isolation: isolate;
    background: radial-gradient(90% 55% at 50% 44%, rgba(22, 52, 104, .55) 0%, rgba(8, 14, 30, 0) 70%), radial-gradient(120% 70% at 20% 0%, #0b1a33 0%, #060a14 48%, var(--bg) 100%); }
  @media (min-width: 500px) { .cadre { height: min(100%, 880px); border: 1px solid var(--line2); border-radius: 38px; box-shadow: 0 0 80px rgba(var(--c1), .12); } }
  .ciel { position: absolute; inset: -24px; z-index: -1; pointer-events: none; will-change: transform; }
  .ciel canvas { width: 100%; height: 100%; display: block; }

  /* ---- le haut ---- */
  .haut { padding: calc(var(--st) + 6px) 16px 4px; min-width: 0; overflow: hidden; }
  .etiq { text-align: center; font: 500 11px/1.3 var(--display); letter-spacing: .08em; color: rgba(163, 179, 202, .78); }
  .barre { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
  .quand { flex: 1; min-width: 0; }
  .quand b { display: block; font: 700 18px/1.2 var(--display); white-space: nowrap; }
  .quand span { display: block; color: var(--muted); font-size: 13.5px; white-space: nowrap; }
  .cherche { display: inline-flex; align-items: center; gap: 7px; min-height: 44px; padding: 0 14px 0 12px; border: 1px solid var(--line2); border-radius: 99px; background: var(--glass); color: var(--fg); font-weight: 600; font-size: 14px; }
  .rond { flex: 0 0 44px; width: 44px; height: 44px; display: grid; place-items: center; border: 1px solid var(--line2); border-radius: 50%; background: var(--glass); padding: 0; }
  .puces { display: flex; gap: 8px; margin-top: 8px; }
  .puce { display: inline-flex; align-items: center; gap: 7px; min-height: 36px; min-width: 0; padding: 0 12px; border: 1px solid var(--line); border-radius: 99px; background: var(--glass2); font-size: 13px; font-weight: 600; white-space: nowrap; position: relative; }
  .puce::after { content: ""; position: absolute; inset: -5px 0; }
  .puce span { overflow: hidden; text-overflow: ellipsis; }
  .puce.large { flex: 1 1 auto; } .puce.fixe { flex: 0 0 auto; } .puce em { font-style: normal; color: var(--muted); }
  .pt { flex: 0 0 9px; width: 9px; height: 9px; border-radius: 50%; background: rgb(var(--vert)); display: inline-block; }
  .pt.e-venir, .pt.e-cours, .pt.e-lire { background: rgb(var(--c1)); } .pt.e-oui { background: rgb(var(--amb)); } .pt.e-err { background: rgb(var(--red)); } .pt.e-pause { background: transparent; border: 1.5px dashed rgb(var(--gris)); }

  /* ---- la scène : le globe, ses secteurs, les orbites ---- */
  .scene { position: relative; min-height: 0; touch-action: none; user-select: none; -webkit-user-select: none; transition: opacity .3s, transform .4s cubic-bezier(.2, .8, .2, 1), filter .3s; }
  .cadre.f-on .scene { opacity: .32; transform: scale(.95); filter: blur(1.5px); }
  .legende { position: absolute; left: 0; right: 0; top: 0; display: none; flex-wrap: wrap; justify-content: center; gap: 2px 11px; padding: 0 10px; font: 500 11px/1.5 var(--sans); color: var(--muted); pointer-events: none; }
  .legende span { display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; } .legende .pt { flex-basis: 7px; width: 7px; height: 7px; }
  .legende .f { width: 9px; height: 9px; border: 1.5px solid rgba(var(--c2), .8); border-radius: 50%; } .legende .f.d { border-radius: 3px; }
  .systeme { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
  .orbites { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
  .orbites .o { fill: none; stroke: rgba(var(--c1), .38); stroke-width: 1; stroke-dasharray: 2 7; }
  .orbites .o.ext { stroke: rgba(var(--c3), .5); stroke-dasharray: 1 6; }
  .orbites .lien { fill: none; stroke: rgba(var(--amb), .6); stroke-width: 1.2; stroke-dasharray: 3 6; animation: coule 1.6s linear infinite; }
  .orbites .grain { fill: rgb(var(--c2)); opacity: .8; }
  @keyframes coule { to { stroke-dashoffset: -18; } }
  .globe { position: absolute; left: 0; top: 0; width: 184px; height: 184px; margin: -92px 0 0 -92px; }
  .globe > canvas, .globe > svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .globe > canvas { pointer-events: none; }
  .sect { cursor: pointer; outline: none; }
  .sect .arc { fill: rgba(var(--c1), .09); stroke: rgba(var(--c1), .42); stroke-width: 1; transition: fill .25s, stroke .25s; }
  .sect text { font: 600 10.5px var(--display); letter-spacing: .13em; fill: #cfe6ff; text-transform: uppercase; pointer-events: none; }
  .sect .zone { fill: transparent; }
  .sect .sig { fill: rgb(var(--amb)); }
  .sect.on .arc, .sect:active .arc { fill: rgba(var(--c3), .42); stroke: rgb(var(--c2)); }
  .sect:focus-visible .arc { stroke: #fff; stroke-width: 2; }
  .coeur { position: absolute; left: 50%; top: 50%; width: 58px; height: 58px; margin: -29px 0 0 -29px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0; padding: 0; border: 1px solid rgba(var(--c2), .65); border-radius: 50%; color: #fff;
    background: radial-gradient(circle at 50% 40%, rgba(var(--c2), .5), rgba(var(--c3), .28) 70%, rgba(8, 14, 30, .3)); box-shadow: 0 0 22px rgba(var(--c1), .55), inset 0 0 14px rgba(var(--c2), .35); animation: coeur 3.6s ease-in-out infinite; }
  .coeur small { font: 700 10px/1 var(--display); letter-spacing: .1em; text-transform: uppercase; margin-top: 1px; }
  @keyframes coeur { 50% { box-shadow: 0 0 34px rgba(var(--c1), .8), inset 0 0 18px rgba(var(--c2), .5); } }

  /* ---- les satellites ---- */
  .sat { position: absolute; left: 0; top: 0; width: 86px; height: 40px; margin: -20px 0 0 -43px; display: flex; justify-content: center; padding: 0; border: 0; background: none; text-align: center; will-change: transform; }
  .sat::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 74px; }
  .sat.sup::before { top: auto; bottom: 0; }
  .sat .lab { position: absolute; left: 50%; top: 43px; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; animation: lab-b .5s; }
  .sat.sup .lab { top: auto; bottom: 43px; animation: lab-h .5s; }
  @keyframes lab-b { from { opacity: 0; } } @keyframes lab-h { from { opacity: 0; } }
  .sat .n { position: relative; width: 40px; height: 40px; display: grid; place-items: center; border-radius: 50%; border: 1.5px solid rgba(var(--vert), .45); background: rgba(6, 12, 28, .92); color: rgb(var(--vert)); transition: border-color .3s, color .3s, box-shadow .3s; }
  .sat.d .n { border-radius: 13px; }
  .sat .n::after { content: ""; position: absolute; inset: -1.5px; border-radius: inherit; border: 1.5px solid currentColor; opacity: 0; }
  .sat b { font: 600 12.5px/1.15 var(--display); white-space: nowrap; text-shadow: 0 1px 5px #020308, 0 0 10px #020308; }
  .sat small { font: 500 11px/1.25 var(--sans); color: var(--muted); white-space: nowrap; text-shadow: 0 1px 5px #020308, 0 0 10px #020308; }
  .sat .bad { position: absolute; top: -6px; right: -7px; min-width: 18px; height: 18px; padding: 0 4px; border-radius: 99px; background: rgb(var(--amb)); color: #1a1200; font: 700 11.5px/18px var(--display); }
  .sat.e-venir .n, .sat.e-lire .n { border-color: rgba(var(--c1), .85); color: rgb(var(--c2)); }
  .sat.e-cours .n { border-color: rgb(var(--c2)); color: rgb(var(--c2)); box-shadow: 0 0 16px rgba(var(--c1), .7); }
  .sat.e-cours .n::after { animation: onde 1.4s ease-out infinite; }
  .sat.e-oui .n { border-color: rgb(var(--amb)); color: rgb(var(--amb)); box-shadow: 0 0 16px rgba(var(--amb), .5); }
  .sat.e-oui .n::after { animation: onde 2.4s ease-out infinite; }
  .sat.e-oui small { color: rgb(var(--amb)); }
  .sat.e-err .n { border-color: rgb(var(--red)); color: rgb(var(--red)); box-shadow: 0 0 16px rgba(var(--red), .55); }
  .sat.e-err .n::after { animation: onde 1.1s ease-out infinite; }
  .sat.e-err small { color: rgb(var(--red)); }
  .sat.e-pause .n { border-style: dashed; border-color: rgba(var(--gris), .8); color: rgb(var(--gris)); }
  .sat.e-pause b { color: var(--muted); }
  .sat:active .n { transform: scale(.93); }
  @keyframes onde { 0% { opacity: .8; transform: scale(1); } 100% { opacity: 0; transform: scale(1.7); } }
  .cours3 circle { animation: clign 1s infinite; } .cours3 circle:nth-child(2) { animation-delay: .18s; } .cours3 circle:nth-child(3) { animation-delay: .36s; }
  @keyframes clign { 0%, 100% { opacity: .25; } 40% { opacity: 1; } }

  /* ---- la pile : ce qui attend ton oui ---- */
  .pile { position: relative; padding: 20px 14px calc(var(--sb) + 12px); z-index: 2; }
  .tard { margin-left: auto; flex: 0 0 auto; min-height: 30px; padding: 0 11px; border: 1px solid var(--line2); border-radius: 99px; background: rgba(125, 211, 252, .08); color: var(--fg); font: 600 12.5px var(--sans); letter-spacing: 0; text-transform: none; position: relative; }
  .tard::after { content: ""; position: absolute; inset: -8px -4px; }
  .cartes { position: relative; height: 134px; }
  .carte { position: absolute; left: 0; right: 0; bottom: 0; height: 134px; display: flex; flex-direction: column; padding: 10px 14px 12px; border: 1px solid rgba(var(--amb), .5); border-radius: 22px; background: linear-gradient(165deg, #1a2238 0%, #0b1224 100%); box-shadow: 0 -6px 26px rgba(var(--amb), .1); transform-origin: 50% 0;
    transition: transform .3s cubic-bezier(.2, .8, .2, 1), opacity .3s; touch-action: pan-y; }
  .carte.c1 { transform: translateY(-9px) scale(.94); opacity: .75; } .carte.c2 { transform: translateY(-17px) scale(.88); opacity: .45; }
  .carte.c1 > *, .carte.c2 > * { visibility: hidden; }
  .carte.glisse { transition: none; } .cartes.tire .carte.c1 { opacity: 1; } .cartes.tire .carte.c1 > * { visibility: visible; }
  .carte.part-d { transform: translateX(120%) rotate(9deg); opacity: 0; } .carte.part-g { transform: translateX(-120%) rotate(-9deg); opacity: 0; }
  .carte .tt { display: flex; align-items: center; gap: 8px; min-height: 22px; font: 600 12px var(--display); letter-spacing: .15em; text-transform: uppercase; color: rgb(var(--amb)); white-space: nowrap; }
  .carte .tt b { min-width: 20px; padding: 0 6px; border-radius: 99px; background: rgb(var(--amb)); color: #1a1200; font: 700 12.5px/20px var(--display); letter-spacing: 0; text-align: center; }
  .carte p { flex: 1; margin-top: 2px; font-size: 15.5px; line-height: 1.32; font-weight: 600; }
  .carte .act { display: grid; grid-template-columns: 1.5fr 1fr 1fr; gap: 8px; }
  .vide-msg { min-height: 62px; display: flex; align-items: center; gap: 10px; padding: 8px 14px; border: 1px dashed var(--line2); border-radius: 18px; color: rgb(var(--vert)); font-weight: 600; }
  .vide-msg span { color: var(--fg); }
  .glisse-i { position: absolute; top: -12px; z-index: 2; padding: 2px 10px; border-radius: 99px; font: 700 12px var(--display); opacity: 0; }
  .glisse-i.o { right: 12px; background: rgb(var(--vert)); color: #022; } .glisse-i.t { left: 12px; background: rgb(var(--gris)); color: #0b1020; }

  /* ---- boutons et briques communes ---- */
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; min-height: 44px; padding: 0 14px; border: 1px solid var(--line2); border-radius: 14px; background: rgba(125, 211, 252, .07); font-weight: 600; font-size: 15px; white-space: nowrap; text-align: center; }
  .btn.p { border: 0; background: linear-gradient(90deg, #0ea5e9, #8b5cf6); color: #fff; box-shadow: 0 4px 18px rgba(14, 165, 233, .3); }
  .btn.r { border-color: rgba(var(--red), .6); color: rgb(var(--red)); background: rgba(var(--red), .08); }
  .btn.pt2 { min-height: 38px; font-size: 14px; padding: 0 12px; border-radius: 12px; position: relative; } .btn.pt2::after { content: ""; position: absolute; inset: -4px 0; }
  .btn:active { transform: scale(.97); }
  .btn[disabled] { opacity: .5; }

  /* ---- la feuille du bas ---- */
  .voile { position: absolute; inset: 0; z-index: 20; background: rgba(2, 4, 10, .5); opacity: 0; pointer-events: none; transition: opacity .28s; }
  .cadre.f-on .voile { opacity: 1; pointer-events: auto; }
  .feuille { position: absolute; left: 0; right: 0; bottom: 0; z-index: 21; max-height: calc(100% - var(--st) - 34px); display: flex; flex-direction: column; border: 1px solid var(--line2); border-bottom: 0; border-radius: 26px 26px 0 0;
    background: linear-gradient(180deg, #0d1933 0%, #070d1c 60%); box-shadow: 0 -18px 60px rgba(var(--c1), .14); transform: translateY(104%); transition: transform .34s cubic-bezier(.2, .8, .2, 1); visibility: hidden; }
  .cadre.f-on .feuille { transform: none; visibility: visible; }
  .feuille.glisse { transition: none; }
  .f-tete { flex: 0 0 auto; padding: 8px 10px 8px 16px; touch-action: none; }
  .f-tete::before { content: ""; display: block; width: 42px; height: 5px; margin: 0 auto 6px; border-radius: 99px; background: rgba(163, 179, 202, .45); }
  .f-ligne { display: flex; align-items: center; gap: 6px; }
  .f-ligne .tt { flex: 1; min-width: 0; }
  .f-ligne h2 { font: 700 21px/1.2 var(--display); }
  .f-ligne p { color: var(--muted); font-size: 13.5px; }
  .f-ligne .rond { border-color: var(--line); background: rgba(125, 211, 252, .06); }
  .f-ligne .retour { margin-left: -8px; }
  .f-corps { flex: 1 1 auto; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; padding: 4px 16px calc(var(--sb) + 22px); scrollbar-width: none; }
  .f-corps::-webkit-scrollbar { display: none; }
  .h3 { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin: 18px 2px 8px; font: 600 12px var(--display); letter-spacing: .15em; text-transform: uppercase; color: #7dd3fc; }
  .h3 span { font: 500 13px var(--sans); letter-spacing: 0; text-transform: none; color: var(--muted); }
  .h3:first-child { margin-top: 6px; }
  .bloc { padding: 14px; border: 1px solid var(--line); border-radius: 18px; background: linear-gradient(160deg, rgba(30, 41, 59, .55), rgba(13, 21, 40, .6)); }
  .bloc + .bloc { margin-top: 10px; }
  .bloc.amb { border-color: rgba(var(--amb), .5); } .bloc.rouge { border-color: rgba(var(--red), .55); background: linear-gradient(160deg, rgba(80, 22, 30, .4), rgba(13, 21, 40, .6)); }
  .bloc p + p { margin-top: 6px; } .muet { color: var(--muted); font-size: 13.5px; }
  .rang { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; } .rang .btn { flex: 1 1 auto; }
  .lg { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 54px; padding: 8px 2px; border: 0; border-top: 1px solid var(--line); background: none; text-align: left; }
  .lg:first-child { border-top: 0; }
  .lg .t { flex: 1; min-width: 0; } .lg .t b { display: block; font-weight: 600; } .lg .t small { display: block; color: var(--muted); font-size: 13.5px; line-height: 1.35; }
  .lg .m { font: 600 15px var(--display); white-space: nowrap; } .lg .chev { color: var(--muted); flex: 0 0 auto; }
  .lg .ico { flex: 0 0 36px; width: 36px; height: 36px; display: grid; place-items: center; border-radius: 11px; background: rgba(var(--c1), .12); color: rgb(var(--c2)); }
  .etiq2 { display: inline-flex; align-items: center; gap: 5px; padding: 2px 9px; border-radius: 99px; font: 600 12.5px var(--sans); white-space: nowrap; border: 1px solid var(--line2); }
  .etiq2.vert { border-color: rgba(var(--vert), .55); color: rgb(var(--vert)); } .etiq2.amb { border-color: rgba(var(--amb), .6); color: rgb(var(--amb)); } .etiq2.rouge { border-color: rgba(var(--red), .6); color: rgb(var(--red)); } .etiq2.gris { color: var(--muted); }
  .etat-g { display: flex; align-items: center; gap: 10px; font: 700 19px var(--display); } .etat-g .pt { flex-basis: 12px; width: 12px; height: 12px; }
  .faits { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }
  .fait { padding: 10px 12px; border: 1px solid var(--line); border-radius: 14px; background: rgba(4, 8, 20, .5); min-width: 0; } .fait small { display: block; color: var(--muted); font-size: 12.5px; } .fait b { display: block; font-weight: 600; font-size: 14.5px; line-height: 1.3; }
  .deux { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
  /* l'horaire */
  .seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; padding: 4px; border: 1px solid var(--line); border-radius: 14px; background: rgba(4, 8, 20, .5); }
  .seg button { min-height: 44px; padding: 2px 4px; border: 0; border-radius: 10px; background: none; font-size: 13.5px; font-weight: 600; line-height: 1.15; color: var(--muted); }
  .seg button[aria-pressed="true"] { background: linear-gradient(90deg, rgba(var(--c1), .34), rgba(var(--c3), .32)); color: #fff; }
  .jours { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; margin-top: 10px; }
  .jours button { min-height: 44px; padding: 0; border: 1px solid var(--line2); border-radius: 12px; background: none; font: 600 13px var(--display); color: var(--muted); }
  .jours button[aria-pressed="true"] { border-color: rgb(var(--c2)); background: rgba(var(--c1), .22); color: #fff; }
  .heures { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; align-items: center; }
  .heure { display: inline-flex; align-items: center; border: 1px solid var(--line2); border-radius: 12px; background: rgba(4, 8, 20, .6); overflow: hidden; }
  .heure input { width: 92px; min-height: 44px; padding: 0 4px 0 12px; border: 0; background: none; color: var(--fg); font: 600 16px var(--display); color-scheme: dark; }
  .heure button { width: 38px; min-height: 44px; border: 0; border-left: 1px solid var(--line); background: none; color: var(--muted); font-size: 18px; }
  .btn.orig { width: 100%; margin-top: 8px; flex-direction: column; gap: 0; padding: 7px 12px; white-space: normal; line-height: 1.25; } .btn.orig small { color: var(--muted); font-size: 12.5px; font-weight: 500; }
  .apercu { margin-top: 12px; padding: 10px 12px; border-radius: 12px; background: rgba(var(--c1), .1); border: 1px solid var(--line); font-weight: 600; }
  .apercu small { display: block; color: var(--muted); font-weight: 500; font-size: 12.5px; }
  /* l'historique */
  .hist { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 2px 10px; padding: 9px 0; border-top: 1px solid var(--line); font-size: 14px; }
  .hist:first-of-type { border-top: 0; } .hist small { grid-column: 2; color: var(--muted); font-size: 12.5px; } .hist .d { font-weight: 600; } .hist .du { font: 600 13.5px var(--display); color: var(--muted); grid-row: 1; grid-column: 3; }
  .hist .pt { grid-row: 1 / span 2; }
  /* les étapes d'une chaîne */
  .etapes { list-style: none; margin: 0; padding: 0; }
  .etapes li { position: relative; display: flex; gap: 12px; padding: 0 0 16px; }
  .etapes li:last-child { padding-bottom: 0; }

    ranger: function (v, arg) { var d = DEPOT[+arg]; d.st = 'range'; RECENTS.unshift([d.nom, d.dossier + ' · rangé à l’instant']); changeDossier = false; var s = DEPOT.filter(function (x) { return x.st === 'attente'; })[0]; if (s) s.st = 'propose'; majSignaux(); rendre(true); toast('Rangé dans ' + d.dossier + ' : « ' + d.nom + ' ».'); },
    retirer: function (v, arg) { DEPOT[+arg].st = 'retire'; changeDossier = false; var s = DEPOT.filter(function (x) { return x.st === 'attente'; })[0]; if (s) s.st = 'propose'; majSignaux(); rendre(true); toast('Fichier retiré. Rien n’a été rangé.'); },
    mois: function (v) { moisSel = +v; rendre(true); },
    'mois-pages': function (v) { moisFin = Math.max(5, Math.min(23, moisFin + (+v))); moisSel = moisFin; rendre(true); },
    regl: function (v) { if (v === 'calme') { calmeChoisi = !calmeChoisi; cadre.classList.toggle('calme', calmeChoisi); } else REG[v] = !REG[v]; rendre(true); },
    parler: ouvreParler,
    'parler-fermer': function () { cadre.classList.remove('p-on'); parle.mode = 'repos'; },
    'parler-vers': function (v, arg) { cadre.classList.remove('p-on'); ouvrir(v, arg, true); },
    'parler-dom': function (v) { cadre.classList.remove('p-on'); ACT.domaine(v); },
    sugg: function (v, arg, el) { demander(el.textContent); },
    dicter: function () { if (parle.occupe) return; var m = $('#p-mic'); m.classList.add('on'); etatParle('ecoute', 'Je t’écoute…'); var q = 'Où en est le CRA du mois ?';
      setTimeout(function () { $('#p-in').value = q; }, calme() ? 0 : 1100); setTimeout(function () { m.classList.remove('on'); demander(q); }, calme() ? 50 : 1900); }
  };
  document.addEventListener('click', function (e) {
    var el = e.target.closest('[data-a]'); if (!el || el.disabled) return;
    var f = ACT[el.getAttribute('data-a')]; if (f) f(el.getAttribute('data-v') || '', el.getAttribute('data-arg') || '', el);
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') { if (cadre.classList.contains('p-on')) ACT['parler-fermer'](); else if (cadre.classList.contains('f-on')) fermer(); }
    if ((e.key === 'Enter' || e.key === ' ') && e.target.classList && e.target.classList.contains('sect')) { e.preventDefault(); ACT.domaine(e.target.getAttribute('data-v')); }
  });
  document.addEventListener('input', function (e) {
    if (e.target.id === 'q') { cherche = e.target.value; $('#res').innerHTML = resultats(); }
    if (e.target.matches && e.target.matches('.heure input') && edit) { if (e.target.value) edit.heures[+e.target.getAttribute('data-h')] = e.target.value; $('#apercu').textContent = horaireTxt(edit); }
  });

  /* ================= départ ================= */
  creeSats(); majSats(); majPile(); mesure(); etoiles(); place(0);
  window.addEventListener('resize', function () { mesure(); etoiles(); });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(mesure);
  requestAnimationFrame(boucle);
  /* pour le banc d'essai */
  window.__orbite = { G: G, NODES: NODES, tourner: function (a) { rot = a; place(0); }, fige: function () { vAuto = 0; elan = 0; } };
})();
