<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<title>JARVIS OS · maquette UX</title>
<!-- Maquette de refonte UX (21/11/2026), à valider par le propriétaire. Données d'exemple inventées : rien n'est lu ni écrit.
     Principes : 5 portes au lieu de 12, un seul modèle d'écran, une seule couche (feuille du bas), aucun geste caché sur la barre. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<script src="globe.js"></script>
<script src="personnages.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700&family=Oxanium:wght@500;600;700&family=Exo+2:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #02040e; --bg2: #050b1d; --fg: #e6f2ff; --muted: #a3c1e4; --dim: #8aa9d1;
  --c1: 56, 189, 248; --c2: 103, 232, 249; --c3: 168, 85, 247; --c4: 99, 102, 241; --warn: 251, 191, 36; --ok: 52, 211, 153; --bad: 248, 113, 113;
  --line: rgba(var(--c1), .2); --line2: rgba(var(--c1), .38);
  --card: linear-gradient(180deg, rgba(14, 44, 104, .34), rgba(4, 12, 34, .78));
  --display: 'Oxanium', 'Exo 2', system-ui, sans-serif; --sans: 'Exo 2', system-ui, -apple-system, sans-serif; --logo: 'Orbitron', 'Oxanium', sans-serif;
  --top: calc(54px + env(safe-area-inset-top, 0px)); --bar: calc(64px + env(safe-area-inset-bottom, 0px));
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { background: var(--bg); }
body { margin: 0; min-height: 100vh; background: radial-gradient(120% 60% at 50% -10%, rgba(var(--c4), .22), transparent 60%), radial-gradient(90% 50% at 100% 30%, rgba(var(--c3), .10), transparent 60%), var(--bg); background-attachment: fixed; color: var(--fg); font: 400 15px/1.45 var(--sans); -webkit-font-smoothing: antialiased; overflow-x: hidden; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
.wrap { max-width: 520px; margin: 0 auto; padding: calc(var(--top) + 6px) 16px calc(var(--bar) + 28px); }

/* ---------- profondeur : sol en grille et poussière d'étoiles derrière tout ---------- */
body::before { content: ""; position: fixed; z-index: -1; left: -60%; right: -60%; bottom: -2vh; height: 46vh; pointer-events: none; background-image: linear-gradient(rgba(var(--c1), .16) 1px, transparent 1px), linear-gradient(90deg, rgba(var(--c1), .16) 1px, transparent 1px); background-size: 46px 46px; transform: perspective(260px) rotateX(62deg); transform-origin: 50% 100%; -webkit-mask-image: linear-gradient(to top, rgba(0, 0, 0, .9), transparent 85%); mask-image: linear-gradient(to top, rgba(0, 0, 0, .9), transparent 85%); }
body::after { content: ""; position: fixed; z-index: -1; inset: 0; pointer-events: none; opacity: .55; background-image: radial-gradient(1px 1px at 12% 18%, #cfefff, transparent), radial-gradient(1px 1px at 72% 9%, #e9d5ff, transparent), radial-gradient(1.5px 1.5px at 88% 34%, #a5f3fc, transparent), radial-gradient(1px 1px at 33% 41%, #cfefff, transparent), radial-gradient(1px 1px at 55% 23%, #fff, transparent), radial-gradient(1.5px 1.5px at 20% 62%, #c4b5fd, transparent), radial-gradient(1px 1px at 64% 55%, #cfefff, transparent), radial-gradient(1px 1px at 92% 71%, #fff, transparent), radial-gradient(1px 1px at 6% 83%, #a5f3fc, transparent), radial-gradient(1px 1px at 44% 77%, #e9d5ff, transparent); }

/* ---------- en-tête : logo ou retour, petit titre au défilement, Grok, recherche ---------- */
.top { position: fixed; z-index: 30; left: 0; right: 0; top: 0; height: var(--top); padding: env(safe-area-inset-top, 0px) 12px 0; display: flex; align-items: center; gap: 8px; background: rgba(2, 6, 20, .72); -webkit-backdrop-filter: blur(18px) saturate(140%); backdrop-filter: blur(18px) saturate(140%); border-bottom: 1px solid transparent; transition: border-color .2s; }
.top.is-scrolled { border-bottom-color: var(--line); }
.top-in { width: 100%; max-width: 520px; margin: 0 auto; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; }
.logo { font: 700 16px var(--logo); letter-spacing: .14em; color: rgb(var(--c2)); text-shadow: 0 0 12px rgba(var(--c1), .55); justify-self: start; min-height: 44px; display: flex; align-items: center; }
.back { justify-self: start; display: flex; align-items: center; gap: 2px; min-height: 44px; color: rgb(var(--c2)); font-weight: 500; font-size: 16px; padding-right: 8px; }
.back svg { width: 22px; height: 22px; }
.mini { font: 600 16px var(--display); opacity: 0; transform: translateY(6px); transition: opacity .18s, transform .18s; white-space: nowrap; max-width: 46vw; overflow: hidden; text-overflow: ellipsis; }
.top.is-scrolled .mini { opacity: 1; transform: none; }
.tools { justify-self: end; display: flex; align-items: center; gap: 4px; }
.ic-btn { width: 40px; height: 44px; display: grid; place-items: center; border-radius: 12px; color: var(--muted); }
.ic-btn svg { width: 21px; height: 21px; }
.pill-grok { display: flex; align-items: center; gap: 6px; height: 30px; padding: 0 10px; border-radius: 999px; border: 1px solid rgba(var(--warn), .45); color: #fde68a; font: 600 12px var(--sans); white-space: nowrap; }
.pill-grok i { width: 7px; height: 7px; border-radius: 50%; background: rgb(var(--warn)); box-shadow: 0 0 8px rgb(var(--warn)); }

/* ---------- grand titre ---------- */
.lt { margin: 4px 0 2px; font: 700 30px/1.15 var(--display); letter-spacing: .01em; }
.lt-sub { margin: 0 0 16px; color: var(--muted); font-size: 14px; }

/* ---------- cartes ---------- */
.card { position: relative; border-radius: 20px; background: var(--card); border: 1px solid var(--line); padding: 14px 16px; box-shadow: inset 0 1px 0 rgba(150, 220, 255, .12), 0 12px 30px rgba(0, 0, 0, .35), 0 0 24px rgba(14, 165, 233, .05); }
.hero { border: 1px solid transparent; background: linear-gradient(180deg, rgba(14, 44, 104, .55), rgba(4, 12, 34, .9)) padding-box, linear-gradient(135deg, rgba(var(--c1), .9), rgba(var(--c3), .8)) border-box; box-shadow: 0 0 28px rgba(var(--c1), .12); padding: 16px; margin-bottom: 18px; }
.hero .k { color: var(--muted); font-size: 13px; }
.hero .big { font: 700 34px/1.1 var(--display); margin: 4px 0; }
.hero p { margin: 6px 0 0; color: var(--muted); font-size: 14px; }
.hero .row-btn { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
.sec { display: flex; align-items: baseline; justify-content: space-between; margin: 22px 2px 10px; }
.sec h2 { margin: 0; font: 600 13px var(--display); letter-spacing: .14em; text-transform: uppercase; color: rgb(var(--c2)); }
.sec a, .sec button { color: rgb(var(--c1)); font-size: 14px; text-decoration: none; min-height: 32px; }

/* ---------- boutons ---------- */
.btn { min-height: 44px; padding: 0 16px; border-radius: 999px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; font: 600 15px var(--sans); border: 1px solid var(--line2); background: rgba(var(--c1), .08); color: var(--fg); }
.btn.primary { border: 0; color: #031022; background: linear-gradient(90deg, rgb(var(--c2)), rgb(var(--c1)) 55%, rgb(var(--c4))); box-shadow: 0 0 18px rgba(var(--c1), .35); }
.btn.warn { border: 0; color: #1d1200; background: linear-gradient(90deg, #fde68a, rgb(var(--warn))); }
.btn.full { width: 100%; }
.cost { font: 600 11px var(--sans); padding: 2px 7px; border-radius: 999px; background: rgba(0, 0, 0, .22); border: 1px solid rgba(255, 255, 255, .2); letter-spacing: .02em; white-space: nowrap; }
.btn:not(.primary):not(.warn) .cost { background: rgba(var(--c1), .1); border-color: var(--line); color: var(--muted); }
.btn:active, .row:active, .tile:active, .tab:active { transform: scale(.97); }

/* ---------- filtres : un seul contrôle segmenté, collé sous l'en-tête ---------- */
.seg { position: sticky; top: calc(var(--top) + 6px); z-index: 5; display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 4px; padding: 4px; margin: 0 0 14px; border-radius: 14px; background: rgba(4, 10, 28, .9); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); border: 1px solid var(--line); }
.seg button { min-height: 36px; border-radius: 10px; font: 600 13.5px var(--sans); color: var(--muted); white-space: nowrap; }
.seg button[aria-pressed="true"] { color: #031022; background: linear-gradient(90deg, rgb(var(--c2)), rgb(var(--c1))); }
.seg b { font: 600 12px var(--display); margin-left: 3px; opacity: .8; }

/* ---------- lignes : le même modèle partout ---------- */
.list { display: grid; gap: 8px; }
.row { width: 100%; display: flex; align-items: center; gap: 12px; text-align: left; padding: 12px 14px; border-radius: 18px; background: var(--card); border: 1px solid var(--line); min-height: 64px; transition: transform .12s; box-shadow: inset 0 1px 0 rgba(150, 220, 255, .1), 0 8px 22px rgba(0, 0, 0, .28); }
.list > * { animation: rise .38s cubic-bezier(.2, .9, .25, 1) both; animation-delay: calc(var(--i, 0) * 45ms); }
@keyframes rise { from { opacity: 0; transform: translateY(10px); } }
/* personnages des bots (sphère, silhouette, emblème) */
.ava { position: relative; flex: 0 0 auto; width: 46px; height: 46px; display: block; }
.ava canvas, .avc { width: 100%; height: 100%; display: block; }
.ava.l { width: 56px; height: 56px; } .ava.xl { width: 112px; height: 112px; } .ava.m { width: 40px; height: 40px; }
/* photos */
.ph { position: relative; flex: 0 0 auto; width: 64px; height: 64px; border-radius: 14px; overflow: hidden; background: linear-gradient(135deg, rgba(var(--c4), .6), rgba(var(--c3), .45)); border: 1px solid rgba(var(--c1), .35); box-shadow: 0 6px 16px rgba(0, 0, 0, .4); }
.ph img { width: 100%; height: 100%; object-fit: cover; display: block; }
.ph .dt { position: absolute; left: 4px; bottom: 4px; padding: 1px 6px; border-radius: 8px; background: rgba(2, 6, 20, .78); font: 700 11px var(--display); letter-spacing: .04em; text-transform: uppercase; color: rgb(var(--c2)); }
.photo { position: relative; margin: -16px -16px 14px; height: 190px; border-radius: 19px 19px 0 0; overflow: hidden; background: linear-gradient(135deg, rgba(var(--c4), .6), rgba(var(--c3), .45)); }
.photo img { width: 100%; height: 100%; object-fit: cover; display: block; transform: scale(1.04); animation: kb 18s ease-in-out infinite alternate; }
@keyframes kb { to { transform: scale(1.12) translate(-2%, -1%); } }
.photo::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(2, 6, 20, .05) 30%, rgba(2, 6, 20, .88)); }
.photo .on-ph { position: absolute; z-index: 1; left: 16px; right: 16px; bottom: 12px; }
.photo .kick { font: 600 12px var(--display); letter-spacing: .18em; text-transform: uppercase; color: rgb(var(--c2)); text-shadow: 0 1px 6px #000; }
.photo .ttl { font: 700 30px/1.1 var(--display); text-shadow: 0 2px 12px rgba(0, 0, 0, .7); }
.photo .meta { color: #dbeafe; font-size: 13.5px; text-shadow: 0 1px 6px #000; }
.photo .stamp { position: absolute; z-index: 1; top: 12px; right: 12px; padding: 4px 10px; border-radius: 999px; background: rgba(2, 6, 20, .72); border: 1px solid rgba(var(--c1), .5); font: 700 13px var(--display); color: rgb(var(--c2)); }
.photo .dtile { position: absolute; z-index: 1; top: 12px; left: 12px; width: 54px; padding: 6px 0; border-radius: 14px; text-align: center; background: linear-gradient(160deg, rgb(var(--c1)), rgb(var(--c4))); color: #031022; box-shadow: 0 6px 18px rgba(0, 0, 0, .5); }
.dtile small { display: block; font: 700 11px var(--sans); text-transform: uppercase; } .dtile b { display: block; font: 700 22px/1 var(--display); }
.pcards { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.pcard { position: relative; text-align: left; border-radius: 18px; overflow: hidden; min-height: 168px; border: 1px solid var(--line); background: #071530; box-shadow: 0 10px 24px rgba(0, 0, 0, .4); transition: transform .12s; }
.pcard img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.pcard::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(2, 6, 20, 0) 25%, rgba(2, 6, 20, .92)); }
.pcard span { position: absolute; z-index: 1; left: 12px; right: 12px; bottom: 10px; }
.pcard b { display: block; font: 600 15px/1.25 var(--display); }
.pcard small { display: block; color: #cfe3ff; font-size: 12.5px; margin-top: 2px; }
.pcard .pill { position: absolute; z-index: 1; top: 10px; left: 10px; padding: 3px 9px; border-radius: 999px; font: 700 11.5px var(--display); background: rgba(2, 6, 20, .75); border: 1px solid rgba(var(--c1), .5); color: rgb(var(--c2)); }
.pcard.wide { grid-column: span 2; min-height: 150px; }
.trend { display: inline-block; padding: 1px 7px; border-radius: 999px; font: 700 11.5px var(--display); }
.trend.down { color: #6ee7b7; background: rgba(var(--ok), .12); border: 1px solid rgba(var(--ok), .4); }
.trend.up { color: #fda4af; background: rgba(var(--bad), .1); border: 1px solid rgba(var(--bad), .4); }
.trend.flat { color: var(--muted); border: 1px solid var(--line); }
.vend { display: grid; gap: 1px; border-radius: 14px; overflow: hidden; border: 1px solid var(--line); margin: 12px 0 0; }
.vend div { display: grid; grid-template-columns: 1fr auto auto; gap: 10px; align-items: center; padding: 9px 12px; background: rgba(var(--c1), .05); font-size: 13.5px; }
.vend b { font: 600 14px var(--display); } .vend i { font-style: normal; font-size: 12px; color: var(--muted); } .vend .ok { color: #6ee7b7; } .vend .no { color: #fda4af; }
.chart { position: relative; margin: 10px 0 2px; }
.chart svg { width: 100%; height: 120px; display: block; overflow: visible; }
.board { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 10px; margin: 2px 0 12px; padding: 10px 12px; border-radius: 14px; border: 1px dashed rgba(var(--c1), .45); background: rgba(var(--c1), .05); }
.board b { font: 700 22px var(--display); } .board small { display: block; color: var(--muted); font-size: 11.5px; } .board .arc { height: 26px; }
.facts-row { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0 0; }
.facts-row span { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; padding: 5px 10px; border-radius: 999px; background: rgba(var(--c1), .07); border: 1px solid var(--line); color: #d6e9ff; }
/* globe de l'accueil et de Claude */
.globe { position: relative; } .globe canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.home-globe { height: 172px; margin: -10px -8px -4px; }
.hero-home { text-align: center; padding-top: 10px; }
.hero-home h3 { font: 700 24px var(--display); margin: 0; }
.hero-home p { margin: 6px auto 0; max-width: 340px; }
.hero-home .chips { justify-content: center; }
.claude-globe { height: 190px; margin: -6px 0 0; }
.cl-state { text-align: center; font: 600 12px var(--display); letter-spacing: .2em; text-transform: uppercase; color: rgb(var(--c2)); margin: -6px 0 12px; min-height: 16px; }
.cl-state[data-s="thinking"] { color: #d8b4fe; } .cl-state[data-s="speaking"] { color: #93c5fd; }
/* équipe : la constellation */
.crew { display: grid; justify-items: center; gap: 2px; margin: 4px 0 6px; }
.crew-row { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; width: 100%; margin-top: 8px; }
.crew-row button { display: grid; justify-items: center; gap: 2px; font-size: 11px; color: var(--muted); }
.crew-row .ava { width: 44px; height: 44px; }
.crew-row i { width: 7px; height: 7px; border-radius: 50%; background: var(--dim); }
.crew-row i.amb { background: rgb(var(--warn)); box-shadow: 0 0 8px rgb(var(--warn)); } .crew-row i.live { background: #34d399; box-shadow: 0 0 8px #34d399; }
.row .av { flex: 0 0 auto; width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center; font: 700 15px var(--display); color: #fff; }
.row .tx { flex: 1; min-width: 0; }
.row .t { display: block; font-weight: 600; font-size: 15.5px; line-height: 1.3; }
.row .s { display: block; color: var(--muted); font-size: 13.5px; line-height: 1.35; margin-top: 2px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.row .r { flex: 0 0 auto; text-align: right; display: grid; gap: 2px; justify-items: end; }
.row .r b { font: 600 15px var(--display); white-space: nowrap; }
.row .r small { color: var(--muted); font-size: 12.5px; white-space: nowrap; }
.row .chev { flex: 0 0 auto; color: var(--dim); width: 16px; height: 16px; }
.row.is-urgent { border-color: rgba(var(--warn), .55); box-shadow: inset 3px 0 0 rgb(var(--warn)); }
.due { display: inline-block; margin-top: 6px; font: 600 12px var(--sans); color: #fde68a; }
.due.calm { color: var(--muted); font-weight: 500; }
.tag { display: inline-block; font: 600 11px var(--sans); letter-spacing: .04em; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--line2); color: rgb(var(--c2)); margin-right: 6px; }
.tag.amb { color: #fde68a; border-color: rgba(var(--warn), .5); }
.empty { text-align: center; color: var(--muted); padding: 26px 10px; }

/* ---------- Aujourd'hui ---------- */
.brief { display: flex; gap: 14px; align-items: center; }
.brief .orb-s { flex: 0 0 auto; }
.brief h3 { margin: 0; font: 600 20px var(--display); }
.brief p { margin: 4px 0 0; color: var(--muted); font-size: 14px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
.chip { font: 500 13px var(--sans); padding: 5px 10px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); background: rgba(var(--c1), .05); }
.tl { position: relative; display: grid; gap: 0; padding-left: 18px; }
.tl::before { content: ""; position: absolute; left: 5px; top: 6px; bottom: 6px; width: 2px; background: linear-gradient(rgb(var(--c1)), rgba(var(--c3), .6)); border-radius: 2px; opacity: .55; }
.tl-it { position: relative; display: flex; gap: 12px; align-items: baseline; padding: 9px 0; }
.tl-it::before { content: ""; position: absolute; left: -17px; top: 15px; width: 10px; height: 10px; border-radius: 50%; background: var(--bg2); border: 2px solid rgb(var(--c1)); }
.tl-it.past { opacity: .5; }
.tl-it .h { flex: 0 0 52px; font: 600 15px var(--display); color: rgb(var(--c2)); }
.tl-it .w { font-size: 15px; }
.tl-it .w small { display: block; color: var(--muted); font-size: 13px; }
.tl-now { position: relative; display: flex; align-items: center; gap: 8px; padding: 2px 0; color: rgb(var(--c2)); font: 600 12px var(--display); letter-spacing: .08em; }
.tl-now::before { content: ""; position: absolute; left: -19px; width: 14px; height: 14px; border-radius: 50%; background: rgb(var(--c2)); box-shadow: 0 0 12px rgb(var(--c2)); }
.tl-now::after { content: ""; flex: 1; height: 1px; background: linear-gradient(90deg, rgb(var(--c2)), transparent); }
.week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.wd { display: grid; justify-items: center; gap: 3px; padding: 8px 0 9px; border-radius: 14px; border: 1px solid var(--line); background: rgba(var(--c1), .04); min-height: 64px; }
.wd small { font: 600 11px var(--sans); color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
.wd b { font: 700 17px var(--display); }
.wd .dots { display: flex; gap: 3px; height: 6px; }
.wd .dots i { width: 6px; height: 6px; border-radius: 50%; }
.wd.is-today { background: linear-gradient(180deg, rgba(var(--c1), .45), rgba(var(--c4), .35)); border-color: rgba(var(--c2), .8); box-shadow: 0 0 14px rgba(var(--c1), .35); }
.wd.is-we { background: rgba(var(--c3), .08); }

/* ---------- Espaces ---------- */
.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.tile { text-align: left; display: grid; align-content: start; gap: 4px; padding: 14px; min-height: 132px; border-radius: 20px; background: var(--card); border: 1px solid var(--line); transition: transform .12s; position: relative; overflow: hidden; }
.tile .ti { width: 34px; height: 34px; border-radius: 11px; display: grid; place-items: center; margin-bottom: 6px; color: rgb(var(--c2)); background: rgba(var(--c1), .12); border: 1px solid var(--line); }
.tile .ti svg { width: 19px; height: 19px; }
.tile .tn { font: 600 13px var(--display); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.tile .tv { font: 700 21px/1.15 var(--display); }
.tile .ts { color: var(--muted); font-size: 13px; line-height: 1.3; }
.tile.amb { border-color: rgba(var(--warn), .5); }
.tile.amb .ts b { color: #fde68a; font-weight: 600; }
.tile.pic { justify-content: end; align-content: end; min-height: 168px; }
.tile.pic img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: 0; }
.tile.pic::after { content: ""; position: absolute; inset: 0; z-index: 0; background: linear-gradient(180deg, rgba(2, 6, 20, .15), rgba(2, 6, 20, .9) 70%); }
.tile.pic > span { position: relative; z-index: 1; } .tile.pic .tn { color: rgb(var(--c2)); } .tile.pic .ts { color: #d6e9ff; }
.tile.pic .ti { position: absolute; top: 12px; left: 12px; background: rgba(2, 6, 20, .6); }
.tile svg.spark { position: absolute; right: 14px; top: 18px; width: 64px; height: 24px; opacity: .9; }

/* ---------- Équipe ---------- */
.st { font: 600 12px var(--sans); padding: 3px 9px; border-radius: 999px; white-space: nowrap; border: 1px solid var(--line2); color: rgb(var(--c2)); }
.st.amb { color: #fde68a; border-color: rgba(var(--warn), .55); }
.st.off { color: var(--dim); border-color: rgba(255, 255, 255, .14); }
.st.live { color: #6ee7b7; border-color: rgba(var(--ok), .5); }
.steps { display: flex; gap: 4px; margin-top: 8px; }
.steps i { flex: 1; height: 4px; border-radius: 3px; background: rgba(255, 255, 255, .12); }
.steps i.on { background: linear-gradient(90deg, rgb(var(--c2)), rgb(var(--c1))); }
.steps i.wait { background: rgb(var(--warn)); }
.bars { display: grid; gap: 10px; }
.bar-l { display: grid; grid-template-columns: 70px 1fr 34px; gap: 10px; align-items: center; font-size: 14px; }
.bar-l .tr { height: 8px; border-radius: 99px; background: rgba(var(--c1), .1); overflow: hidden; }
.bar-l .tr i { display: block; height: 100%; border-radius: 99px; }
.bar-l b { font: 600 14px var(--display); text-align: right; }

/* ---------- barre du bas : 5 portes, l'orbe au centre, appui seulement ---------- */
.bar { position: fixed; z-index: 40; left: 0; right: 0; bottom: 0; height: var(--bar); padding: 0 6px env(safe-area-inset-bottom, 0px); background: rgba(2, 6, 20, .94); -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px); border-top: 1px solid rgba(var(--c1), .35); box-shadow: 0 -14px 34px rgba(14, 165, 233, .10); }
.bar-in { max-width: 520px; margin: 0 auto; height: 64px; display: grid; grid-template-columns: repeat(5, 1fr); align-items: center; }
.tab { position: relative; height: 56px; display: grid; justify-items: center; align-content: center; gap: 3px; color: var(--dim); font: 500 11.5px var(--sans); transition: transform .12s, color .2s; }
.tab svg { width: 23px; height: 23px; }
.tab[aria-current="page"] { color: rgb(var(--c2)); }
.tab[aria-current="page"] svg { filter: drop-shadow(0 0 6px rgba(var(--c2), .85)); }
.tab[aria-current="page"]::after { content: ""; position: absolute; bottom: 1px; width: 22px; height: 3px; border-radius: 2px; background: rgb(var(--c2)); box-shadow: 0 0 10px rgb(var(--c2)); }
.badge { position: absolute; top: 4px; left: calc(50% + 6px); min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: rgb(var(--warn)); color: #1d1200; font: 700 11px/18px var(--display); text-align: center; }
.orb-tab { justify-self: center; width: 76px; height: 76px; margin-top: -26px; border-radius: 50%; display: grid; place-items: center; background: radial-gradient(circle, rgba(2, 8, 24, .95) 52%, rgba(2, 8, 24, 0) 70%); }
.orb-tab .globe { width: 76px; height: 76px; }
.orb-tab::after { content: ""; position: absolute; width: 58px; height: 58px; border-radius: 50%; box-shadow: 0 0 0 1px rgba(56, 189, 248, .45), 0 0 22px rgba(56, 189, 248, .4); animation: jvholo 2.6s ease-in-out infinite; pointer-events: none; }
.orb-tab { position: relative; }
@keyframes jvholo { 50% { box-shadow: 0 0 0 1px rgba(103, 232, 249, .75), 0 0 36px rgba(56, 189, 248, .7); } }
.orb { display: block; position: relative; width: 58px; height: 58px; border-radius: 50%; background: radial-gradient(circle at 34% 28%, #e0faff 0, #7dd3fc 14%, rgb(var(--c1)) 30%, rgb(var(--c4)) 62%, #1e1b4b 86%); box-shadow: 0 0 22px rgba(var(--c1), .65), 0 0 2px #fff inset; }
.orb::before, .orb::after { content: ""; position: absolute; inset: -5px; border-radius: 50%; border: 1.5px dashed rgba(var(--c2), .7); animation: spin 9s linear infinite; }
.orb::after { inset: -10px; border: 1px solid rgba(var(--c3), .45); border-left-color: transparent; border-right-color: transparent; animation-duration: 5s; animation-direction: reverse; }
.orb-s { display: block; padding: 10px; } .orb-s .orb { width: 44px; height: 44px; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .orb::before, .orb::after { animation: none; } }

/* ---------- une seule couche : la feuille du bas (moitié ou plein écran) ---------- */
.scrim { position: fixed; inset: 0; z-index: 60; background: rgba(0, 2, 10, 0); transition: background .25s; pointer-events: none; }
.scrim.on { background: rgba(0, 2, 10, .55); pointer-events: auto; }
.sheet { position: fixed; z-index: 61; left: 0; right: 0; bottom: 0; max-width: 560px; margin: 0 auto; height: 92vh; border-radius: 24px 24px 0 0; background: linear-gradient(180deg, #071736, #030a1e 40%); border-top: 1px solid rgba(var(--c1), .5); box-shadow: 0 -24px 60px rgba(14, 165, 233, .18); transform: translateY(100%); transition: transform .32s cubic-bezier(.2, .9, .25, 1); display: flex; flex-direction: column; will-change: transform; }
.sheet.half { transform: translateY(38vh); }
.sheet.full { transform: translateY(0); }
.sheet .grab { flex: 0 0 auto; height: 28px; display: grid; place-items: center; touch-action: none; }
.sheet .grab i { width: 40px; height: 5px; border-radius: 3px; background: rgba(var(--c1), .55); }
.sh-head { flex: 0 0 auto; display: flex; align-items: center; gap: 12px; padding: 0 16px 10px; touch-action: none; }
.sh-head .av { width: 40px; height: 40px; border-radius: 13px; display: grid; place-items: center; font: 700 16px var(--display); color: #fff; flex: 0 0 auto; }
.sh-head h3 { margin: 0; font: 600 18px/1.25 var(--display); }
.sh-head small { color: var(--muted); font-size: 13px; }
.sh-head .x { margin-left: auto; flex: 0 0 auto; width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; background: rgba(var(--c1), .1); border: 1px solid var(--line); color: var(--muted); }
.sh-body { flex: 1; overflow-y: auto; overscroll-behavior: contain; padding: 4px 16px calc(24px + env(safe-area-inset-bottom, 0px)); -webkit-overflow-scrolling: touch; }
.sh-body p { margin: 0 0 12px; font-size: 15px; }
.facts { display: grid; gap: 1px; border-radius: 16px; overflow: hidden; border: 1px solid var(--line); margin: 0 0 14px; }
.facts div { display: flex; justify-content: space-between; gap: 12px; padding: 10px 12px; background: rgba(var(--c1), .05); font-size: 14px; }
.facts div span { color: var(--muted); }
.facts div b { font-weight: 600; text-align: right; }
.acts { display: grid; gap: 8px; margin: 6px 0 14px; }
.acts .btn { justify-content: space-between; }
.more { border: 1px solid var(--line); border-radius: 16px; padding: 0 14px; }
.more summary { min-height: 46px; display: flex; align-items: center; color: rgb(var(--c1)); cursor: pointer; list-style: none; }
.more summary::-webkit-details-marker { display: none; }
.more .acts { margin-top: 0; }
.track { list-style: none; margin: 0 0 14px; padding: 0 0 0 16px; border-left: 2px solid var(--line); display: grid; gap: 10px; }
.track li { position: relative; font-size: 14px; }
.track li::before { content: ""; position: absolute; left: -22px; top: 4px; width: 10px; height: 10px; border-radius: 50%; background: var(--bg2); border: 2px solid rgba(255, 255, 255, .25); }
.track li.on::before { border-color: rgb(var(--c1)); background: rgb(var(--c1)); }
.track li.wait::before { border-color: rgb(var(--warn)); background: rgb(var(--warn)); }
.track li small { display: block; color: var(--muted); font-size: 12.5px; }

/* discussion avec Claude, dans la même feuille */
.msgs { display: grid; gap: 10px; padding-bottom: 8px; }
.msg { max-width: 86%; padding: 10px 13px; border-radius: 18px; font-size: 15px; line-height: 1.4; }
.msg.me { justify-self: end; background: linear-gradient(90deg, rgba(var(--c1), .35), rgba(var(--c4), .35)); border: 1px solid rgba(var(--c1), .5); border-bottom-right-radius: 6px; }
.msg.ai { justify-self: start; background: var(--card); border: 1px solid var(--line); border-bottom-left-radius: 6px; }
.ctx { display: inline-flex; gap: 6px; align-items: center; font-size: 12.5px; color: var(--muted); padding: 4px 10px; border: 1px dashed var(--line2); border-radius: 999px; margin-bottom: 12px; }
.sugs { display: grid; gap: 8px; margin: 4px 0 14px; }
.sugs button { text-align: left; padding: 11px 14px; border-radius: 16px; border: 1px solid var(--line); background: rgba(var(--c1), .05); font-size: 14.5px; }
.compose { flex: 0 0 auto; display: flex; gap: 8px; align-items: center; padding: 10px 12px calc(10px + env(safe-area-inset-bottom, 0px)); border-top: 1px solid var(--line); background: rgba(2, 6, 20, .9); }
.compose input { flex: 1; min-width: 0; height: 44px; border-radius: 22px; border: 1px solid var(--line2); background: rgba(var(--c1), .06); color: var(--fg); padding: 0 16px; font: 15px var(--sans); }
.compose input::placeholder { color: var(--dim); }
.compose .ic-btn { flex: 0 0 auto; width: 44px; border-radius: 50%; background: rgba(var(--c1), .12); color: rgb(var(--c2)); }
.compose .send { background: linear-gradient(90deg, rgb(var(--c2)), rgb(var(--c1))); color: #031022; }

/* ---------- recherche partout, plein écran ---------- */
.search { position: fixed; inset: 0; z-index: 70; background: rgba(2, 4, 14, .97); display: none; flex-direction: column; padding: calc(env(safe-area-inset-top, 0px) + 8px) 16px 0; }
.search.on { display: flex; }
.search-h { display: flex; gap: 10px; align-items: center; max-width: 520px; width: 100%; margin: 0 auto; }
.search-h input { flex: 1; min-width: 0; height: 46px; border-radius: 14px; border: 1px solid var(--line2); background: rgba(var(--c1), .07); color: var(--fg); padding: 0 14px; font: 16px var(--sans); }
.search-h button { color: rgb(var(--c1)); font-size: 16px; min-height: 44px; }
.search-r { flex: 1; overflow-y: auto; max-width: 520px; width: 100%; margin: 0 auto; padding: 8px 0 30px; }

/* ---------- avis ---------- */
.toast { position: fixed; z-index: 80; left: 50%; bottom: calc(var(--bar) + 14px); transform: translate(-50%, 20px); opacity: 0; transition: opacity .2s, transform .2s; max-width: calc(100vw - 32px); padding: 11px 16px; border-radius: 16px; background: #0b1d40; border: 1px solid var(--line2); font-size: 14px; box-shadow: 0 10px 30px rgba(0, 0, 0, .5); pointer-events: none; }
.toast.on { opacity: 1; transform: translate(-50%, 0); }

/* ---------- transitions d'écran ---------- */
.view.enter-push { animation: push .28s cubic-bezier(.2, .9, .25, 1); }
.view.enter-pop { animation: pop .24s cubic-bezier(.2, .9, .25, 1); }
.view.enter-tab { animation: fade .18s ease-out; }
@keyframes push { from { transform: translateX(36%); opacity: 0; } }
@keyframes pop { from { transform: translateX(-24%); opacity: 0; } }
@keyframes fade { from { opacity: 0; transform: translateY(6px); } }
@media (prefers-reduced-motion: reduce) { .view { animation: none !important; } .sheet { transition: none; } }
.note { margin-top: 26px; padding: 12px 14px; border-radius: 16px; border: 1px dashed var(--line2); color: var(--muted); font-size: 13.5px; }
.note a { color: rgb(var(--c1)); }
</style>
</head>
<body>
<header class="top" id="top"><div class="top-in">
  <div id="lead"></div>
  <div class="mini" id="mini"></div>
  <div class="tools">
    <button class="pill-grok" id="grok" type="button" aria-label="Grok en pause : voir l'équipe"><i></i>Grok · mar.</button>
    <button class="ic-btn" type="button" data-act="help" aria-label="Ce qui change dans cette maquette" style="font:700 17px var(--display)">?</button>
    <button class="ic-btn" id="find" type="button" aria-label="Rechercher partout"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4-4"/></svg></button>
  </div>
</div></header>

<main class="wrap"><div class="view" id="view"></div></main>

<div class="toast" id="toast" role="status"></div>

<script>
(() => {
  'use strict';

  const TODAY = new Date(); TODAY.setHours(12, 0, 0, 0);
  const day = (n) => { const d = new Date(TODAY); d.setDate(d.getDate() + n); return d; };
  const F = (d, o) => new Intl.DateTimeFormat('fr-FR', o).format(d);
  const now = new Date();
  const hello = now.getHours() < 12 ? 'Bonjour' : now.getHours() < 18 ? 'Bon après-midi' : 'Bonsoir';

  /* ---------------- icônes ---------------- */
  const P = {
    today: '<circle cx="12" cy="12" r="4"/><path d="M12 2.5v2.2M12 19.3v2.2M4.2 4.2l1.6 1.6M18.2 18.2l1.6 1.6M2.5 12h2.2M19.3 12h2.2M4.2 19.8l1.6-1.6M18.2 5.8l1.6-1.6"/>',
    inbox: '<path d="M3.5 13.5 6 5.5h12l2.5 8v5h-17z"/><path d="M3.5 13.5H9l1.2 2.2h3.6L15 13.5h5.5"/>',

  const ic = (k, s) => '<svg viewBox="0 0 24 24" width="' + (s || 22) + '" height="' + (s || 22) + '" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + P[k] + '</svg>';
  const spark = (pts, col) => { const mx = Math.max(...pts), mn = Math.min(...pts), r = (mx - mn) || 1; const d = pts.map((v, i) => (i ? 'L' : 'M') + (i * 64 / (pts.length - 1)).toFixed(1) + ' ' + (22 - (v - mn) / r * 20).toFixed(1)).join(' '); return '<svg class="spark" viewBox="0 0 64 24" preserveAspectRatio="none" aria-hidden="true"><path d="' + d + '" fill="none" stroke="' + (col || 'rgb(103,232,249)') + '" stroke-width="2" stroke-linejoin="round"/></svg>'; };

  /* ---------------- données d'exemple (inventées) ---------------- */

  const mountAv = (root) => { if (!window.UXAvatars) return; (root || document).querySelectorAll('.ava[data-bot]:not(.on)').forEach((e) => { e.classList.add('on'); UXAvatars.mount(e, e.dataset.bot, {ask: !!e.dataset.ask, work: !!e.dataset.work}); }); };
  /* photos : Wikimedia Commons, licences libres (crédits : « Crédits photos » au bas d'Espaces) */
  const PHOTOS = {"lisbonne":{"auteur":"Dale Cruse - 10M views from San Francisco, CA, USA","licence":"CC BY 4.0","page":"https://commons.wikimedia.org/wiki/File%3AAlfama_Rooftops_and_Tagus_River_View%2C_Lisbon_%2854733828355%29.jpg"},"lille":{"auteur":"Velvet","licence":"CC BY-SA 3.0","page":"https://commons.wikimedia.org/wiki/File%3ALille_gd_place_colonne.jpg"},"laponie":{"auteur":"YosemiteYamper","licence":"CC BY-SA 4.0","page":"https://commons.wikimedia.org/wiki/File%3AAurora_borealis_over_grillkota%2C_Naamijoki%2C_Pello.jpg"},"basque":{"auteur":"Eusebius","licence":"CC BY 3.0","page":"https://commons.wikimedia.org/wiki/File%3ABiarritz_-_pano_plage.jpg"},"rome":{"auteur":"Diliff","licence":"CC BY-SA 2.5","page":"https://commons.wikimedia.org/wiki/File%3AColosseum_in_Rome-April_2007-1-_copie_2B.jpg"},"spectacle":{"auteur":"Sister72","licence":"CC BY 2.0","page":"https://www.flickr.com/photos/79874304@N00/196867770"},"ferme":{"auteur":"San José Public Library","licence":"CC BY-SA 2.0","page":"https://www.flickr.com/photos/26204872@N08/9867545575"},"noel":{"auteur":"Michael Cavén","licence":"CC BY 2.0","page":"https://www.flickr.com/photos/29241649@N02/5285604343"},"aquarium":{"auteur":"Follow Your Nose","licence":"CC BY 2.0","page":"https://www.flickr.com/photos/31816015@N02/4881676285"},"robot":{"auteur":"dvanzuijlekom","licence":"CC BY-SA 2.0","page":"https://www.flickr.com/photos/52365139@N05/8499549941"},"casque":{"auteur":"GuitarChalk","licence":"CC BY 2.0","page":"https://www.flickr.com/photos/161844010@N02/46173306114"},"poussette":{"auteur":"corsi photo","licence":"CC BY 2.0","page":"https://www.flickr.com/photos/11211909@N00/16232411324"},"liseuse":{"auteur":"jblyberg","licence":"CC BY 2.0","page":"https://www.flickr.com/photos/36813960@N00/4505413539"},"cafetiere":{"auteur":"Lars Plougmann","licence":"CC BY-SA 2.0","page":"https://www.flickr.com/photos/75062596@N00/2569906181"},"poupee":{"auteur":"Gail Frederick","licence":"CC BY 2.0","page":"https://www.flickr.com/photos/71365354@N00/5274490147"}};
  const pic = (k) => PHOTOS[k] ? '<img src="photos/' + k + '.jpg" alt="" decoding="async">' : '';
  const ph = (k, dt) => '<span class="ph">' + pic(k) + (dt ? '<span class="dt">' + esc(dt) + '</span>' : '') + '</span>';

  function creditsSheet() {
    openSheet(sheetHead('', 'Crédits', 'Photos de Wikimedia Commons, sous licence libre') + '<div class="sh-body"><div class="list">' + Object.keys(PHOTOS).map((k) => '<a class="row" href="' + esc(PHOTOS[k].page) + '" target="_blank" rel="noopener">' + ph(k) + '<span class="tx"><span class="t">' + esc(PHOTOS[k].auteur || 'Auteur inconnu') + '</span><span class="s">' + esc(PHOTOS[k].licence) + ' · Wikimedia Commons</span></span></a>').join('') + '</div><p class="note">Personnages des bots : silhouettes de game-icons.net (Lorc, Delapouite et contributeurs), licence CC BY 3.0.</p></div>', true);
  }
  function genericSheet(t, sub, facts, acts) { openSheet(sheetHead('', t, sub) + '<div class="sh-body">' + (facts ? '<div class="facts">' + facts.map(([a, b]) => '<div><span>' + esc(a) + '</span><b>' + esc(b) + '</b></div>').join('') + '</div>' : '') + '<div class="acts">' + btns(acts || [['Ouvrir', 'gratuit', 'primary']]) + '</div></div>'); }
  function claudeSheet() {
    const where = NAMES[cur()] || (DOM[cur()] && DOM[cur()].n);
    const sug = {auj: ['Qu’est-ce que je fais en premier ?', 'Prépare ma semaine'], moi: ['Explique-moi le CRA en attente', 'Réponds au syndic pour moi'], achats: ['Le robot va-t-il encore baisser ?', 'Trouve une idée de cadeau à 50 €'], argent: ['Pourquoi 161 € d’ici ma paie ?', 'Quelles dépenses ont augmenté ?']}[cur()] || ['Qu’est-ce que je fais en premier ?', 'Résume cette page'];
    openSheet(sheetHead(av('claude', {cls: 'm', work: true}), 'JARVIS', 'Claude, chef d’équipe · réponse mot par mot')
      + '<div class="sh-body" id="chat"><div class="gslot" data-g="claude"></div><div class="cl-state" id="cl-state"></div><span class="ctx">Tu regardes : ' + esc(where) + '</span><div class="sugs">' + sug.map((s) => '<button type="button" data-act="ask:' + esc(s) + '">' + esc(s) + '</button>').join('') + '</div><div class="msgs" id="msgs"></div></div>'
      + '<form class="compose" id="compose"><button type="button" class="ic-btn" data-act="toast:mic" aria-label="Dicter">' + ic('mic', 21) + '</button><input id="ask" placeholder="Demande à Claude…" autocomplete="off"><button type="submit" class="ic-btn send" aria-label="Envoyer">' + ic('send', 20) + '</button></form>', true);
    if (!G_CL && window.UXGlobe) { G_CL = UXGlobe.create({ring: true, nodes: 140}); G_CL.el.classList.add('claude-globe'); }
    const sl = sheet.querySelector('.gslot[data-g="claude"]'); if (sl && G_CL) sl.replaceWith(G_CL.el);
    gset('listening'); ASK.t = setTimeout(() => gset('idle'), 2600);
    $('compose').addEventListener('submit', (e) => { e.preventDefault(); const v = $('ask').value.trim(); if (v) { ask(v); $('ask').value = ''; } });
    $('ask').addEventListener('focus', () => { clearTimeout(ASK.t); gset('listening'); });
    $('ask').addEventListener('blur', () => { if (G_CL && G_CL.state === 'listening') gset('idle'); });
  }
  const ASK = {t: 0, i: 0};
  const ANS = {
    'Qu’est-ce que je fais en premier ?': ['Commence par le CRA : Chronos attend ton oui avant vendredi 17 h, c’est un seul passage. Ensuite le robot à 389 € : le prix tient jusqu’à dimanche. Le reste peut attendre lundi.', 'i1'],
    'Prépare ma semaine': ['Lundi : veille d’Iris et bilan d’Argus. Mardi : l’expert du syndic le matin, puis Grok repart à 12 h 47. Jeudi : l’attestation d’assurance à envoyer. Vendredi : le CRA, si tu ne l’as pas validé avant.', 'i8'],
    'Le robot va-t-il encore baisser ?': ['Probablement pas avant le Black Friday : il a perdu 12 % en trois semaines et touche le plus bas des deux derniers mois. À 389 €, il est sous ton seuil : c’est un bon moment.', 'i2']
  };
  function ask(q) {
    const m = $('msgs'); if (!m) return; const s = document.querySelector('.sugs'); if (s) s.remove();
    clearTimeout(ASK.t); clearInterval(ASK.i);
    m.insertAdjacentHTML('beforeend', '<div class="msg me">' + esc(q) + '</div><div class="msg ai"><span class="tx"></span></div>');
    const a = m.lastElementChild, ans = ANS[q] || ['Maquette : ici, la vraie réponse de Claude s’écrit mot par mot, avec ses cartes (rendez-vous, achat, demande) et ses propositions à valider d’un bouton.'], txt = ans[0].split(' ');
    gset('thinking'); $('chat').scrollTop = 1e6;
    ASK.t = setTimeout(() => { gset('speaking'); let i = 0; ASK.i = setInterval(() => { a.firstChild.textContent += (i ? ' ' : '') + txt[i++]; $('chat').scrollTop = 1e6; if (i >= txt.length) { clearInterval(ASK.i); const it = ans[1] && ITEMS.find((x) => x.id === ans[1]); if (it) { a.insertAdjacentHTML('beforeend', '<div class="list" style="margin-top:10px">' + itemRow(it) + '</div>'); mountAv(a); } ASK.t = setTimeout(() => gset('idle'), 700); } }, 70); }, 1300);
  }

  /* ---------------- recherche partout ---------------- */
  const IDX = ITEMS.map((i) => ['Pour moi', i.t, 'item:' + i.id]).concat(AG.map((e) => ['Agenda', e.t, 'ev:' + e.t]), [['Papiers', 'Passeport', 'go:papiers'], ['Papiers', 'Titre de séjour', 'go:papiers'], ['Papiers', 'Carte Vitale', 'go:papiers'], ['Papiers', 'Quittance de loyer', 'go:papiers'], ['Achats', 'Robot Alpha X7', 'go:achats'], ['Achats', 'Liseuse Folio', 'go:achats'], ['Voyages', 'Lisbonne', 'go:voyages'], ['Argent', 'Box internet', 'go:argent']]);
  const norm = (s) => s.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
  function search(q) {
    const r = $('q-r'), n = norm(q || '');
    if (!n) { r.innerHTML = sec('Suggestions') + '<div class="list">' + ['Passeport', 'Syndic', 'Robot', 'Lisbonne'].map((s) => row({t: s, act: 'q:' + s})).join('') + '</div>'; return; }
    const hits = IDX.filter((x) => norm(x[1]).includes(n)), by = {};
    hits.forEach((x) => { (by[x[0]] = by[x[0]] || []).push(x); });
    r.innerHTML = hits.length ? Object.keys(by).map((g) => sec(g + ' · ' + by[g].length) + '<div class="list">' + by[g].map((x) => row({t: x[1], act: 'sr:' + x[2]})).join('') + '</div>').join('') : '<p class="empty">Rien pour « ' + esc(q) + ' ».</p>';
  }
  const openFind = (q) => { $('search').classList.add('on'); $('q').value = q || ''; search(q); setTimeout(() => $('q').focus(), 50); };
  const closeFind = () => { $('search').classList.remove('on'); $('q').blur(); };
  $('q').addEventListener('input', (e) => search(e.target.value));
  $('q-x').addEventListener('click', closeFind);
  $('find').addEventListener('click', () => openFind(''));
  $('grok').addEventListener('click', () => { closeSheet(); if (S.tab !== 'espaces') { S.y[cur()] = scrollY; S.tab = 'espaces'; S.stack.espaces = ['espaces']; scrollTo(0, 0); } if (cur() !== 'equipe') go('equipe'); });

  /* ---------------- avis ---------------- */
  let tT = 0; const toast = (t) => { const e = $('toast'); e.textContent = t; e.classList.add('on'); clearTimeout(tT); tT = setTimeout(() => e.classList.remove('on'), 2200); };

  /* ---------------- un seul aiguillage des appuis ---------------- */
  document.addEventListener('click', (e) => {
    const el = e.target.closest('[data-act]'); if (!el) return; const a = el.dataset.act; if (!a) return; e.preventDefault();
    const [k, v] = a.split(':'), w = a.split(':').slice(2).join(':');
    if (k === 'tab') { closeSheet(); tab(v); }
    else if (k === 'go') { closeSheet(); closeFind(); if (DOM[v] || SCREENS[v]) { if (S.tab !== 'espaces' && (DOM[v] || v === 'equipe' || v === 'reglages')) { S.y[cur()] = scrollY; S.tab = 'espaces'; S.stack.espaces = ['espaces']; scrollTo(0, 0); } if (cur() !== v) go(v); } }
    else if (k === 'back') back();
    else if (k === 'filt') { S.f[cur()] = v; const y = scrollY; render(); scrollTo(0, y); }
    else if (k === 'item') { closeFind(); const it = ITEMS.find((i) => i.id === v); if (it) itemSheet(it); }
    else if (k === 'claude') claudeSheet();
    else if (k === 'ask') ask(a.slice(4));
    else if (k === 'close') closeSheet();
    else if (k === 'one') { const it = ITEMS.find((i) => i.k === 'decider'); itemSheet(it); toast('Une par une : la suivante arrive dès ta réponse.'); }
    else if (k === 'find') openFind(v || '');
    else if (k === 'help') helpSheet();
    else if (k === 'credits') creditsSheet();
    else if (k === 'ask-brief') { claudeSheet(); setTimeout(() => ask('Prépare ma semaine'), 350); }
    else if (k === 'q') { $('q').value = v; search(v); }
    else if (k === 'sr') { closeFind(); el.dataset.act = a.slice(3); el.click(); }
    else if (k === 'ev') genericSheet(a.slice(3), 'Agenda', [['Quand', 'voir l’agenda'], ['Agenda', 'Principal']], [['Modifier', 'gratuit', 'primary'], ['Ajouter un rappel', 'gratuit']]);
    else if (k === 'day') genericSheet(F(day(+v), {weekday: 'long', day: 'numeric', month: 'long'}), PRES[+v], AG.filter((x) => x.d === +v).map((x) => [x.h, x.t]), [['Ajouter un événement', 'gratuit', 'primary']]);
    else if (k === 'bot') genericSheet(BOT[v].n, BOT[v].r, [['État', 'voir la liste'], ['Dernier passage', 'ven. 00 h 15'], ['Routines', '2']], [['Lui demander quelque chose', '1 passage', 'primary'], ['Son fil', 'gratuit']]);
    else if (k === 'dem') genericSheet(a.slice(4), 'Ta demande en cours', null, [['Relancer', '1 passage', 'primary'], ['Annuler la demande', 'gratuit']]);
    else if (k === 'dom') genericSheet(w, DOM[v].n, null, [['Voir le détail', 'gratuit', 'primary'], ['En discuter avec Claude', 'Claude', '', 'claude']]);
    else if (k === 'done') { closeSheet(); toast('Maquette : rien n’est envoyé (« ' + a.slice(5) + ' »).'); }
    else if (k === 'toast') toast(v === 'mic' ? 'Maquette : la dictée de l’app actuelle reste la même.' : 'Maquette : écran inchangé.');
  });

  /* glisser depuis le bord gauche : retour (comme une app iOS) */
  let E = null;
  addEventListener('touchstart', (e) => { E = null; if (S.sheet || $('search').classList.contains('on') || S.stack[S.tab].length < 2 || e.touches[0].clientX > 24) return; E = {x0: e.touches[0].clientX, y0: e.touches[0].clientY, t0: performance.now(), on: false}; }, {passive: true});
  addEventListener('touchmove', (e) => { if (!E) return; const dx = e.touches[0].clientX - E.x0, dy = e.touches[0].clientY - E.y0; if (!E.on) { if (Math.abs(dy) > Math.abs(dx)) { E = null; return; } if (dx < 10) return; E.on = true; } $('view').style.transform = 'translateX(' + Math.max(0, dx) + 'px)'; $('view').style.opacity = String(1 - Math.min(.5, dx / innerWidth)); }, {passive: true});
  const eEnd = (cancel) => { const g = E; E = null; const v = $('view'); v.style.transform = ''; v.style.opacity = ''; if (!g || !g.on || cancel) return; };
  addEventListener('touchend', (e) => { if (E && E.on) { const dx = e.changedTouches[0].clientX - E.x0, fast = dx / Math.max(1, performance.now() - E.t0) > .5; eEnd(); if (dx > 100 || (dx > 40 && fast)) back(); } else E = null; }, {passive: true});
  addEventListener('touchcancel', () => eEnd(true), {passive: true});
  addEventListener('keydown', (e) => { if (e.key === 'Escape') { if ($('search').classList.contains('on')) closeFind(); else if (S.sheet) closeSheet(); else back(); } });

  window.__UX = {S, ITEMS, go, tab, back, closeSheet};
  render();
})();
</script>
</body>
