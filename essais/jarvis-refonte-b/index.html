<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#03060d">
<title>JARVIS · Proposition B · Poste de contrôle</title>
<!-- Maquette cliquable (26/11/2026), refonte de JARVIS OS, proposition B « Poste de contrôle ».
     Trois files (À toi, En cours, À venir) qu'on passe d'un glissement, des rails d'étapes, les domaines en filtres,
     une barre de commande en bas. Données inventées : rien n'est lu ni envoyé. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700&family=Oxanium:wght@500;600;700&family=Exo+2:wght@400;500;600;700&display=swap">
<style>
  :root {
    --bg: #03060d; --fg: #e8f0fa; --mut: #a3b5cd; --dim: #7389a8;
    --cy: #67e8f9; --bl: #38bdf8; --vi: #b99cff; --am: #fbbf24; --rd: #ff8f9c; --gr: #6ee7b7;
    --l1: rgba(125, 211, 252, .15); --l2: rgba(125, 211, 252, .32);
    --pan: linear-gradient(180deg, rgba(14, 26, 50, .78), rgba(7, 13, 27, .78));
    --num: 'Oxanium', 'Exo 2', system-ui, sans-serif; --sans: 'Exo 2', system-ui, -apple-system, 'Segoe UI', sans-serif; --logo: 'Orbitron', 'Oxanium', sans-serif;
    --st: env(safe-area-inset-top, 0px); --sb: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; margin: 0; }
  body { background: #010307; color: var(--fg); font: 500 15px/1.4 var(--sans); overflow: hidden; -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; }
  button, input { font: inherit; color: inherit; }
  button { cursor: pointer; background: none; border: 0; padding: 0; text-align: left; }
  :focus-visible { outline: 2px solid var(--cy); outline-offset: 2px; }
  h1, h2, h3, h4, p, ol, ul { margin: 0; padding: 0; }

  /* ---- le cadre : plein écran sur iPhone, centré sur un ordinateur ---- */
  .app { position: relative; display: grid; grid-template-rows: auto auto auto minmax(0, 1fr) auto; height: 100vh; height: 100dvh; max-width: 430px; margin: 0 auto; overflow: hidden;
    padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px);
    background:
      linear-gradient(rgba(125, 211, 252, .04) 1px, transparent 1px) 0 0 / 100% 26px,
      linear-gradient(90deg, rgba(125, 211, 252, .04) 1px, transparent 1px) 0 0 / 26px 100%,
      radial-gradient(110% 55% at 85% 0%, #0d2142 0%, #060b18 55%, var(--bg) 100%); }
  @media (min-width: 520px) { .app { height: min(100dvh - 32px, 900px); margin-top: 16px; border: 1px solid var(--l2); box-shadow: 0 0 60px rgba(56, 189, 248, .12); } }
  .globe { position: absolute; top: -58px; right: -74px; width: 250px; height: 250px; opacity: .2; pointer-events: none; }
  .globe g { transform-origin: 50% 50%; animation: tourne 90s linear infinite; }
  @keyframes tourne { to { transform: rotate(360deg); } }

  .tag { position: relative; padding: calc(var(--st) + 5px) 16px 5px; font: 500 13px/1.3 var(--sans); color: #d2ae58; text-align: center; text-wrap: balance; border-bottom: 1px dashed rgba(251, 191, 36, .28); background: rgba(251, 191, 36, .05); }
  .top { position: relative; display: flex; align-items: baseline; gap: 10px; padding: 9px 16px 5px; }
  .logo { font: 700 16px var(--logo); letter-spacing: .26em; color: #a9d6ff; text-shadow: 0 0 14px rgba(56, 189, 248, .7); }
  .quand { margin-left: auto; color: var(--mut); font-size: 14px; white-space: nowrap; }
  .quand b { font: 700 16px var(--num); color: var(--fg); margin-right: 5px; }
  .meteo { display: inline-flex; align-items: center; gap: 5px; color: var(--mut); font-size: 14px; white-space: nowrap; padding-left: 10px; border-left: 1px solid var(--l2); }
  .meteo svg { width: 16px; height: 16px; align-self: center; }

  /* ---- le bandeau d'état, toujours là ---- */
  .etat { position: relative; display: flex; align-items: stretch; justify-content: space-between; margin: 0 16px; border: 1px solid var(--l2); border-radius: 3px; background: linear-gradient(90deg, rgba(56, 189, 248, .12), rgba(168, 85, 247, .1)); overflow: hidden; }
  .etat::after { content: ''; position: absolute; inset: 0 auto 0 0; width: 34%; background: linear-gradient(90deg, transparent, rgba(125, 211, 252, .14), transparent); animation: balaie 7s linear infinite; pointer-events: none; }
  @keyframes balaie { from { transform: translateX(-110%); } to { transform: translateX(400%); } }
  .etat button { position: relative; z-index: 1; flex: 1 1 auto; display: flex; align-items: center; justify-content: center; gap: 6px; min-height: 44px; padding: 0 6px; font-size: 15px; white-space: nowrap; color: var(--fg); }
  .etat button + button { border-left: 1px solid var(--l1); }
  .etat b { font: 700 20px var(--num); }
  .e-am b { color: var(--am); } .e-cy b { color: var(--cy); } .e-rd b { color: var(--rd); }
  .e-rd.z, .e-am.z { color: var(--mut); } .e-rd.z b, .e-am.z b { color: var(--gr); }
  .e-rd:not(.z) b { animation: clign 1.6s ease-in-out infinite; }
  @keyframes clign { 50% { opacity: .45; } }

  /* ---- la zone des trois files ---- */
  .zone { position: relative; display: grid; grid-template-rows: auto auto minmax(0, 1fr); min-height: 0; }
  .files { position: relative; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); margin: 10px 16px 0; border-bottom: 1px solid var(--l2); }
  .files button { display: flex; align-items: center; justify-content: center; gap: 7px; min-height: 46px; font: 600 15px var(--num); letter-spacing: .08em; text-transform: uppercase; color: var(--dim); white-space: nowrap; transition: color .2s; }
  .files button[aria-selected="true"] { color: var(--fg); text-shadow: 0 0 12px rgba(103, 232, 249, .55); }
  .files b { min-width: 22px; padding: 1px 5px; border: 1px solid currentColor; border-radius: 2px; font: 700 13px var(--num); letter-spacing: 0; text-align: center; opacity: .9; }
  .files .al { width: 7px; height: 7px; border-radius: 50%; background: var(--rd); box-shadow: 0 0 8px var(--rd); }
  .files button[data-f="0"][aria-selected="true"] b { color: var(--am); } .files button[data-f="1"][aria-selected="true"] b { color: var(--cy); }
  .ind { position: absolute; left: 0; bottom: -1px; width: 33.333%; height: 2px; background: var(--cy); box-shadow: 0 0 12px var(--cy), 0 0 2px #fff; will-change: transform; }
  .chips { display: flex; gap: 8px; padding: 6px 16px; overflow-x: auto; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
  .chips::-webkit-scrollbar { display: none; }
  .chip { position: relative; flex: none; display: inline-flex; align-items: center; gap: 6px; height: 34px; margin: 5px 0; padding: 0 12px; border: 1px solid var(--l1); border-radius: 3px; background: rgba(7, 13, 27, .7); color: var(--mut); font-size: 14px; font-weight: 600; white-space: nowrap; }
  .chip::after { content: ''; position: absolute; inset: -5px 0; }
  .chip[aria-pressed="true"] { color: #021018; background: var(--cy); border-color: var(--cy); box-shadow: 0 0 14px rgba(103, 232, 249, .45); }
  .chip i { font: 700 13px var(--num); font-style: normal; color: var(--am); } .chip i.r { color: var(--rd); }
  .chip[aria-pressed="true"] i { color: #5a3a00; } .chip[aria-pressed="true"] i.r { color: #8a0f22; }
  .pistes { display: flex; min-height: 0; overflow-x: auto; overflow-y: hidden; scroll-snap-type: x mandatory; scrollbar-width: none; overscroll-behavior-x: contain; }
  .pistes::-webkit-scrollbar { display: none; }
  .file { flex: 0 0 100%; min-width: 0; padding: 2px 16px 28px; overflow-y: auto; overflow-x: hidden; scroll-snap-align: start; scroll-snap-stop: always; scrollbar-width: none; overscroll-behavior-y: contain; }
  .file::-webkit-scrollbar { display: none; }

  /* ---- briques ---- */
  .sh { display: flex; align-items: center; gap: 8px; margin: 16px 0 8px; font: 600 13px var(--num); letter-spacing: .14em; text-transform: uppercase; color: var(--cy); }
  .sh:first-child { margin-top: 8px; }
  .sh::after { content: ''; flex: 1; height: 1px; background: linear-gradient(90deg, var(--l2), transparent); }
  .sh span { order: 2; font: 500 13px var(--sans); letter-spacing: 0; text-transform: none; color: var(--mut); white-space: nowrap; }
  .sh.am { color: var(--am); }
  .bloc { position: relative; border: 1px solid var(--l1); border-radius: 3px; background: var(--pan); }
  .bloc::before, .bloc::after { content: ''; position: absolute; width: 9px; height: 9px; pointer-events: none; }
  .bloc::before { top: -1px; left: -1px; border-top: 2px solid var(--bl); border-left: 2px solid var(--bl); }
  .bloc::after { bottom: -1px; right: -1px; border-bottom: 2px solid var(--bl); border-right: 2px solid var(--bl); }
  .bloc + .bloc { margin-top: 10px; }
  .b { display: inline-flex; align-items: center; justify-content: center; min-height: 46px; padding: 0 14px; border-radius: 3px; font-weight: 700; font-size: 16px; white-space: nowrap; text-align: center; }
  .b1 { background: var(--cy); color: #021018; box-shadow: 0 0 16px rgba(103, 232, 249, .35); }
  .b2 { border: 1px solid var(--l2); color: var(--fg); background: rgba(7, 13, 27, .6); font-weight: 600; }
  .b.sm { min-height: 44px; font-size: 15px; padding: 0 12px; }
  .acts { display: flex; gap: 8px; } .acts .b1 { flex: 1.5; } .acts .b2 { flex: 1; }
  .bdg { flex: none; padding: 1px 7px; border: 1px solid currentColor; border-radius: 2px; font: 600 13px var(--num); white-space: nowrap; }
  .bdg.toi { color: var(--am); } .bdg.run { color: var(--cy); } .bdg.ok { color: var(--gr); border-color: rgba(110, 231, 183, .5); } .bdg.err { color: var(--rd); } .bdg.att { color: var(--vi); }
  .pt { flex: none; width: 10px; height: 10px; border-radius: 50%; background: var(--gr); box-shadow: 0 0 8px rgba(110, 231, 183, .7); }
  .pt.err { background: var(--rd); box-shadow: 0 0 10px var(--rd); animation: clign 1.2s ease-in-out infinite; }
  .pt.soon { background: var(--cy); box-shadow: 0 0 10px var(--cy); animation: clign 1.8s ease-in-out infinite; }
  .vide { padding: 18px 14px; color: var(--mut); text-align: center; }
  .vide b { display: block; color: var(--fg); font-size: 16px; margin-bottom: 2px; }
  .flash { animation: flash 1.6s ease-out 1; }
  @keyframes flash { 0%, 40% { box-shadow: 0 0 0 2px var(--cy), 0 0 26px rgba(103, 232, 249, .6); } 100% { box-shadow: 0 0 0 0 transparent; } }

  /* ---- les rails d'étapes ---- */
  .rail { display: grid; grid-template-columns: repeat(var(--n), minmax(0, 1fr)); width: 100%; }
  .rail .s { position: relative; display: flex; flex-direction: column; align-items: center; gap: 5px; min-width: 0; text-align: center; }
  .rail .s::before { content: ''; position: absolute; top: 8px; right: 50%; width: 100%; height: 2px; background: var(--cy); box-shadow: 0 0 8px rgba(103, 232, 249, .6); }
  .rail .s:first-child::before { display: none; }
  .rail .s.av::before { background: repeating-linear-gradient(90deg, var(--dim) 0 4px, transparent 4px 8px); box-shadow: none; opacity: .6; }
  .rail .s.toi::before { background: linear-gradient(90deg, var(--cy), var(--am)); }
  .rail .s.run::before, .rail .s.toi::before { background-size: 200% 100%; }
  .rail .s.err::before { background: linear-gradient(90deg, var(--cy), var(--rd)); box-shadow: none; }
  .rail em { font: 500 13px/1.2 var(--sans); font-style: normal; color: var(--mut); padding: 0 2px; max-width: 100%; overflow-wrap: anywhere; }
  .rail .toi em { color: var(--am); font-weight: 700; } .rail .run em { color: var(--cy); font-weight: 700; } .rail .err em { color: var(--rd); font-weight: 700; } .rail .av em { color: var(--dim); }
  .rail.nu em { display: none; }
  .st { position: relative; z-index: 1; flex: none; display: block; width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--dim); background: #050a15; }
  .fait > .st { border-color: var(--cy); background: var(--cy); box-shadow: 0 0 10px rgba(103, 232, 249, .65); }
  .fait > .st::after { content: ''; position: absolute; left: 4px; top: 1px; width: 4px; height: 8px; border: solid #02121a; border-width: 0 2px 2px 0; transform: rotate(45deg); }
  .toi > .st { border-color: var(--am); background: #1a1200; animation: pouls-a 1.6s ease-out infinite; }
  .toi > .st::after { content: ''; position: absolute; inset: 3px; border-radius: 50%; background: var(--am); }
  .run > .st { border-color: var(--cy); animation: pouls-c 1.2s ease-out infinite; }
  .run > .st::after { content: ''; position: absolute; inset: 3px; border-radius: 50%; background: var(--cy); animation: clign .8s ease-in-out infinite; }
  .err > .st { border-color: var(--rd); background: #2a0810; }
  .err > .st::before, .err > .st::after { content: ''; position: absolute; left: 6px; top: 2px; width: 2px; height: 10px; background: var(--rd); transform: rotate(45deg); }
  .err > .st::after { transform: rotate(-45deg); }
  @keyframes pouls-a { 0% { box-shadow: 0 0 0 0 rgba(251, 191, 36, .7); } 100% { box-shadow: 0 0 0 10px rgba(251, 191, 36, 0); } }
  @keyframes pouls-c { 0% { box-shadow: 0 0 0 0 rgba(103, 232, 249, .7); } 100% { box-shadow: 0 0 0 10px rgba(103, 232, 249, 0); } }
  /* le rail debout (une chaîne ouverte) */
  .vr { list-style: none; padding: 6px 0 0; }
  .vr li { position: relative; display: grid; grid-template-columns: 18px minmax(0, 1fr); gap: 12px; padding-bottom: 14px; }
  .vr li::before { content: ''; position: absolute; left: 8px; top: 18px; bottom: 0; width: 2px; background: var(--cy); box-shadow: 0 0 8px rgba(103, 232, 249, .5); }
  .vr li:last-child { padding-bottom: 2px; } .vr li:last-child::before { display: none; }
  .vr li.toi::before, .vr li.run::before, .vr li.av::before, .vr li.err::before { background: repeating-linear-gradient(180deg, var(--dim) 0 4px, transparent 4px 8px); box-shadow: none; opacity: .6; }
  .vr b { display: block; font-weight: 600; line-height: 1.25; } .vr small { display: block; color: var(--mut); font-size: 13.5px; }
  .vr .av b { color: var(--mut); font-weight: 500; } .vr .toi small { color: var(--am); font-weight: 600; } .vr .run small { color: var(--cy); font-weight: 600; } .vr .err small { color: var(--rd); font-weight: 600; }
  .vr .acts { margin-top: 8px; }

  /* ---- À toi : une décision par carte ---- */
  .dec { padding: 11px 12px 12px 15px; }
  .dec > .bar { position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--am); box-shadow: 0 0 10px rgba(251, 191, 36, .6); }
  .dec-h { display: flex; justify-content: space-between; gap: 8px; font: 500 13px var(--num); letter-spacing: .04em; color: var(--mut); }
  .dec-h span:last-child { color: var(--dim); white-space: nowrap; }
  .dec h3 { margin-top: 3px; font: 700 17px/1.25 var(--sans); }
  .dec .q { color: var(--fg); opacity: .92; }
  .dec .viz { display: flex; align-items: center; gap: 10px; margin: 9px 0 11px; min-height: 26px; }
  .dec .viz .rail { flex: 0 0 46%; } .dec .viz > small { flex: 1; color: var(--mut); font-size: 13px; line-height: 1.25; }
  .sem7 { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 4px; width: 100%; }
  .sem7 span { display: flex; align-items: center; justify-content: center; gap: 5px; height: 26px; border: 1px solid rgba(103, 232, 249, .45); background: rgba(103, 232, 249, .1); border-radius: 2px; font: 600 13px var(--num); color: var(--cy); }
  .sem7 span.c { border-color: rgba(185, 156, 255, .5); background: rgba(185, 156, 255, .1); color: var(--vi); }
  .tf { display: flex; align-items: center; gap: 10px; padding: 6px 8px 6px 12px; border-top: 1px solid var(--l1); }
  .tf:first-child { border-top: 0; }
  .tf > button:first-child, .tf > div:first-child { flex: 1; min-width: 0; min-height: 44px; display: flex; flex-direction: column; justify-content: center; }
  .tf b { font-weight: 600; line-height: 1.25; } .tf small { color: var(--mut); font-size: 13px; } .tf small.am { color: var(--am); }
  .tf.ok b { color: var(--mut); font-weight: 500; }

  /* ---- En cours : les chaînes, le tableau de bord, les mails ---- */
  .ch-h { display: grid; grid-template-columns: minmax(0, 1fr) auto auto 16px; align-items: center; column-gap: 8px; row-gap: 10px; width: 100%; padding: 10px 12px 10px; }
  .cn b { display: block; font: 700 16px/1.2 var(--sans); } .cn small { display: block; color: var(--mut); font-size: 13px; }
  .cnt { font: 700 16px var(--num); color: var(--fg); } .cnt small { color: var(--dim); font-size: 13px; }
  .chev { width: 16px; height: 16px; color: var(--mut); transition: transform .2s; } .on .chev { transform: rotate(180deg); }
  .ch-h .rail, .ch-f { grid-column: 1 / -1; }
  .ch-f { display: flex; justify-content: space-between; gap: 8px; padding-top: 8px; border-top: 1px solid var(--l1); color: var(--mut); font-size: 13px; }
  .ch-f b { font: 600 14px var(--num); color: var(--fg); }
  .ch.e-toi .ch-f span:last-child b { color: var(--am); } .ch.e-run .ch-f span:last-child b { color: var(--cy); }
  .ch-d { padding: 0 12px 12px; border-top: 1px dashed var(--l1); }
  .ch.e-toi { border-color: rgba(251, 191, 36, .4); } .ch.e-toi::before, .ch.e-toi::after { border-color: var(--am); }
  .sub { margin: 12px 0 6px; font: 600 13px var(--num); letter-spacing: .1em; text-transform: uppercase; color: var(--bl); }
  .kv { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 34px; padding: 5px 0; border-top: 1px solid var(--l1); }
  .kv span:first-child { min-width: 0; } .kv span:last-child { flex: none; color: var(--mut); font: 500 14px var(--num); text-align: right; }
  .kv .am { color: var(--am) !important; } .kv .gr { color: var(--gr) !important; }
  .lien { display: inline-flex; align-items: center; min-height: 44px; color: var(--cy); font-weight: 600; text-decoration: underline; text-underline-offset: 3px; }

  .hud-top { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-bottom: 1px solid var(--l1); font: 600 14px var(--num); letter-spacing: .04em; }
  .hud-top b { color: var(--gr); font-weight: 600; }
  .ecg { margin-left: auto; width: 96px; height: 20px; color: var(--gr); }
  .ecg path { fill: none; stroke: currentColor; stroke-width: 1.6; stroke-dasharray: 60 190; animation: ecg 2.4s linear infinite; filter: drop-shadow(0 0 3px currentColor); }
  .ecg path.f { stroke-dasharray: none; animation: none; opacity: .25; filter: none; }
  @keyframes ecg { from { stroke-dashoffset: 250; } to { stroke-dashoffset: 0; } }
  .cols, .rt { display: grid; grid-template-columns: 10px minmax(0, 1fr) 68px 82px; column-gap: 8px; align-items: center; width: 100%; padding: 0 10px; }
  .cols { padding-top: 6px; padding-bottom: 4px; font: 600 13px var(--num); letter-spacing: .1em; text-transform: uppercase; color: var(--dim); }
  .cols span:nth-child(n+3), .rt .rd, .rt .rp { text-align: right; }
  .rt { min-height: 52px; padding-top: 6px; padding-bottom: 6px; border-top: 1px solid var(--l1); }
  .rt .rn b { display: block; font-weight: 600; line-height: 1.2; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; } .rt .rn small { display: block; color: var(--mut); font-size: 13px; line-height: 1.25; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rt .rd, .rt .rp { font: 600 14px var(--num); white-space: nowrap; } .rt .rd { color: var(--mut); }
  .rt.soon .rp { color: var(--cy); }
  .rt.err { background: linear-gradient(90deg, rgba(255, 143, 156, .16), rgba(255, 143, 156, .03)); box-shadow: inset 3px 0 0 var(--rd); }
  .rt.err .rd { color: var(--rd); } .rt.err .rp { color: var(--am); }
  .rt .al { grid-column: 2 / -1; margin-top: 3px; color: var(--rd); font-size: 14px; font-weight: 600; line-height: 1.3; }
  .rt .al span { color: var(--am); }
  .rt-d { padding: 8px 12px 12px 28px; border-top: 1px dashed var(--l1); background: rgba(3, 6, 13, .45); }
  .rt-d p { color: var(--fg); margin-top: 8px; } .rt-d p small { display: block; color: var(--mut); font-size: 13px; }
  .hist { display: flex; align-items: center; gap: 4px; margin-top: 10px; color: var(--mut); font-size: 13px; }
  .hist i { width: 7px; height: 16px; border-radius: 1px; background: var(--gr); opacity: .85; } .hist i.x { background: var(--rd); } .hist i.n { background: var(--dim); opacity: .35; }
  .hist span { margin-left: 6px; }

  .ml { padding: 10px 12px 11px; border-top: 1px solid var(--l1); } .ml:first-child { border-top: 0; }
  .ml-h { display: flex; align-items: center; justify-content: space-between; gap: 8px; } .ml-h b { font: 700 16px/1.2 var(--sans); }
  .ar { display: grid; grid-template-columns: auto minmax(24px, 1fr) auto; align-items: center; gap: 8px; margin-top: 8px; }
  .ar .p { display: flex; align-items: center; gap: 6px; font: 600 15px var(--num); white-space: nowrap; }
  .ar .p svg { width: 18px; height: 18px; } .ar .a { color: var(--cy); } .ar .r { color: var(--gr); } .ar .w { color: var(--vi); }

  }

  // ---- file 3 : À venir ----
  function evLi(e) {
    var fini = e.todo && S.fait[e.todo];
    var c = '<span class="h">' + e.h + '</span><i class="mk"></i>', t = '<b>' + e.t + '</b><small>' + (fini ? 'fait' : e.s) + '</small>';
    return '<li class="' + e.ty + (e.al ? ' al' : '') + '">' + c + (e.id ? '<button data-act="voir" data-f="' + e.f + '" data-id="' + e.id + '">' + t + '</button>' : '<div>' + t + '</div>') + '</li>';
  }
  function fVenir() {
    var h = fiche() + '<div class="auj bloc"><div><b>Jeudi 26 novembre</b><small>6 °C, couvert · 2 rendez-vous d’ici demain</small></div><div class="t">16:10</div></div><div class="sem">' +
      JOURS.map(function (j, i) {
        var ev = j.ev.filter(vis);
        return '<button class="' + (i ? '' : 'now') + (ev.length ? '' : ' z') + '" data-act="jour" data-id="' + j.k + '" aria-label="' + j.l + '"><small>' + j.c + '</small><b>' + j.n + '</b><span class="n">' + ev.slice(0, 3).map(function (e) { return '<i class="' + (e.ty === 'ech' ? 'e' : e.ty === 'pas' ? 'p' : '') + '"></i>'; }).join('') + '</span></button>';
      }).join('') + '</div>', n = 0;
    JOURS.forEach(function (j) {
      var ev = j.ev.filter(vis);
      if (!ev.length && S.dom !== 'tout') return;
      n += ev.length;
      h += '<h3 class="dj" id="x-' + j.k + '">' + j.l + (j.l2 ? ' <small>' + j.l2 + '</small>' : '') + '</h3>' + (ev.length ? '<ol class="tl">' + ev.map(evLi).join('') + '</ol>' : '<p class="rien">rien de prévu</p>');
    });
    var t = TARD.filter(vis);
    if (t.length) h += '<h3 class="dj">Plus tard <small>après le 2 décembre</small></h3><ol class="tl">' + t.map(evLi).join('') + '</ol>';
    if (!n && !t.length) h += '<div class="bloc vide" style="margin-top:12px"><b>Rien à venir dans ' + NOMDOM[S.dom] + '.</b>Les 7 prochains jours sont libres pour ce domaine.</div>';
    h += '<div class="leg"><span><i class="pt" style="background:var(--cy);box-shadow:none"></i>rendez-vous</span><span><i class="pt" style="background:var(--am);border-radius:2px;box-shadow:none"></i>échéance</span><span><i class="pt" style="background:none;border:2px solid var(--vi);box-shadow:none"></i>passage d’Hermes</span></div>';
    return h;
  }

  // ---- tout redessiner ----
  function render() {
    var g = compte(true), c = compte(false);
    $('#etat').innerHTML = '<button class="e-am' + (g.dec ? '' : ' z') + '" data-act="file" data-f="0"><b>' + g.dec + '</b>à trancher</button>' +
      '<button class="e-cy" data-act="file" data-f="1"><b>' + g.cours + '</b>en cours</button>' +
      '<button class="e-rd' + (g.err ? '' : ' z') + '" data-act="erreur"><b>' + g.err + '</b>en erreur</button>';
    var tb = $$('#files button');
    tb[0].innerHTML = 'À toi <b>' + c.dec + '</b>';
    tb[1].innerHTML = 'En cours <b>' + c.cours + '</b>' + (c.err ? '<i class="al" title="une erreur"></i>' : '');
    tb[2].innerHTML = 'À venir <b>' + c.venir + '</b>';
    $('#chips').innerHTML = DOMS.map(function (d) {
      var n = d[0] === 'tout' ? 0 : DEC.filter(function (x) { return x.dom === d[0] && S.dec[x.id] === 'att'; }).length;
      var t = d[0] === 'papiers' ? (S.fait.devis ? 0 : 1) + (S.fait.passeport ? 0 : 1) : 0;
      return '<button class="chip" data-act="dom" data-id="' + d[0] + '" aria-pressed="' + (S.dom === d[0]) + '">' + d[1] + (n ? '<i>' + n + '</i>' : t ? '<i>' + t + '</i>' : '') + '</button>';
    }).join('');
    $('#f0').innerHTML = fToi(); $('#f1').innerHTML = fCours(); $('#f2').innerHTML = fVenir();
  }

  // ---- naviguer ----
  var pistes = $('#pistes'), ind = $('#ind');
  function file(i, vite) { S.f = i; pistes.scrollTo({ left: i * pistes.clientWidth, behavior: vite || calme ? 'auto' : 'smooth' }); onglets(i); }
  function onglets(i) { $$('#files button').forEach(function (b, k) { b.setAttribute('aria-selected', k === i ? 'true' : 'false'); }); }
  pistes.addEventListener('scroll', function () {
    var p = pistes.scrollLeft / (pistes.clientWidth || 1);
    ind.style.transform = 'translateX(' + (p * 100) + '%)';
    var i = Math.round(p); if (i !== S.f) { S.f = i; onglets(i); }
  }, { passive: true });
  window.addEventListener('resize', function () { pistes.scrollLeft = S.f * pistes.clientWidth; });
  function voir(f, id, ouvre) {
    fermer();
    var it = chaines().concat(sujets(), ROUT, MAILS, DEC).filter(function (x) { return x.id === id; })[0];
    if (it && !vis(it)) S.dom = 'tout';
    if (ouvre !== false && id && !/^(m|d|j)\d/.test(id)) S.open[id] = true;
    render(); file(f, true);
    var el = document.getElementById('x-' + id);
    if (el) { var p = el.closest('.file'); p.scrollTop = Math.max(0, el.offsetTop - p.offsetTop - 70); el.classList.add('flash'); setTimeout(function () { el.classList.remove('flash'); }, 1700); }
  }
  function toast(m, lien) {
    var t = $('#toast'), b = $('button', t); $('span', t).textContent = m;
    if (lien) { b.hidden = false; b.textContent = lien.l; b.onclick = function () { t.classList.remove('on'); voir(lien.f, lien.id); }; } else b.hidden = true;
    t.classList.add('on'); clearTimeout(T.toast); T.toast = setTimeout(function () { t.classList.remove('on'); }, 4200);
  }

  // ---- trancher ----
  function oui(id) {
    var d = DEC.filter(function (x) { return x.id === id; })[0]; S.dec[id] = 'oui';
    if (id === 'd2') { S.depot = 'run'; clearTimeout(T.d2); T.d2 = setTimeout(function () { S.depot = 'fait'; render(); toast('CRA déposé sur le portail. Chaîne bouclée.', { l: 'Voir', f: 1, id: 'cra' }); }, 5200); }
    if (id === 'd3') { S.ndf = 'run'; clearTimeout(T.d3); T.d3 = setTimeout(function () { S.ndf = 'fait'; render(); toast('Note de frais Télétravail créée sur le portail.', { l: 'Voir', f: 1, id: 'ndf' }); }, 6400); }
    render(); toast(d.suite, d.voir ? { l: 'Suivre', f: 1, id: d.voir } : null);
  }
  function annuler(id) { S.dec[id] = 'att'; if (id === 'd2') { clearTimeout(T.d2); S.depot = 'att'; } if (id === 'd3') { clearTimeout(T.d3); S.ndf = 'non'; } render(); toast('Annulé : la décision revient dans « À toi ».'); }

  // ---- parler à JARVIS (réponses d'exemple) et chercher ----
  var parl = $('#parl'), q = $('#q'), cmd = $('#cmd');
  var SUG = ['Où en est mon CRA du mois ?', 'Qu’est-ce qui est en erreur ?', 'J’ai quoi demain ?', 'Combien il me reste à payer ?'];
  function etatP(e) { parl.className = 'parl on ' + e; cmd.classList.toggle('ecoute', e === 'ecoute'); $('#petat').textContent = { pret: 'prêt · demande ou cherche', ecoute: 'à l’écoute…', pense: 'réfléchit…', parle: 'répond' }[e]; }
  function ouvrir() { if (S.parl) return; S.parl = true; parl.setAttribute('aria-hidden', 'false'); etatP('pret'); filR(); }
  function fermer() { if (!S.parl) return; S.parl = false; clearInterval(T.dic); parl.className = 'parl'; parl.setAttribute('aria-hidden', 'true'); cmd.classList.remove('ecoute'); q.value = ''; maj(); q.blur(); }
  function filR() {
    var f = $('#fil');
    f.innerHTML = S.fil.length ? S.fil.map(function (m) {
      if (m.w) return '<div class="bu j att"><i></i><i></i><i></i></div>';
      return '<div class="bu ' + (m.m ? 'moi' : 'j') + '">' + (m.m ? esc(m.t) : m.t) + (m.a ? '<div class="acts">' + m.a + '</div>' : '') + '</div>';
    }).join('') : '<div class="intro"><b>Dis-moi, ou cherche.</b>Une question, un ordre, un mot à retrouver : c’est la même barre. Je réponds ici, et je t’emmène à la bonne ligne.</div>';
    f.scrollTop = f.scrollHeight;
    $('#sug').innerHTML = SUG.map(function (s) { return '<button data-act="sug">' + s + '</button>'; }).join('');
  }
  function repondre(x) {
    x = x.toLowerCase().replace(/['’]/g, ' ');
    var b = function (l, f, id) { return '<button class="b b2 sm" data-act="voir" data-f="' + f + '" data-id="' + id + '">' + l + '</button>'; };
    if (/cra/.test(x)) return S.depot === 'att' ? { t: 'Le CRA de novembre est <b>signé par ton client</b> : PDF reçu à 14 h 29. Il reste une étape, le dépôt sur le portail, et elle attend ton oui.', a: '<button class="b b1 sm" data-act="oui" data-id="d2">Oui, déposer</button>' + b('Voir la chaîne', 1, 'cra') }
      : { t: S.depot === 'run' ? 'Hermes est en train de déposer le CRA signé sur le portail. Je te préviens dès que c’est fait.' : 'Le CRA de novembre est déposé sur le portail depuis 16 h 10. La chaîne est bouclée.', a: b('Voir la chaîne', 1, 'cra') };
    if (/erreur|bilan|forfait|cloche|panne|marche pas/.test(x)) return { t: 'Une seule erreur : <b>Bilan de la semaine</b>, arrêté par la limite du forfait. La relance est prévue à 17 h 40. Rien à faire de ton côté.', a: b('Voir la routine', 1, 'bilan') };
    if (/demain|agenda|rendez|aujourd|journ|semaine/.test(x)) return { t: 'Aujourd’hui : <b>pédiatre à 17 h 30</b>. Demain : livraison du colis entre 9 h 45 et 13 h 45. Avant mardi : le devis à envoyer à l’assurance et le rendez-vous passeport.', a: '<button class="b b2 sm" data-act="file" data-f="2">Voir « À venir »</button>' };
    if (/argent|reste|payer|budget|depens|dépens|prelev|prélèv/.test(x)) return { t: 'Il te reste <b>640 €</b> à payer ce mois. Déjà dépensé : 1 180 €. Prochain prélèvement : Électricité, 62 €, le 28.', a: '<button class="b b2 sm" data-act="dom" data-id="argent">Ouvrir Argent</button>' };
    if (/prix|aspirateur|casque|achat/.test(x)) return { t: 'L’aspirateur balai est à <b>189 €</b>, sous ton seuil de 200 €. Le casque audio est encore à 279 € (seuil 240 €).', a: '<button class="b b2 sm" data-act="dom" data-id="achats">Ouvrir Achats</button>' };
    if (/sinistre|assurance|devis|expert|degat|dégât/.test(x)) return { t: 'Sinistre dégât des eaux : le devis du plombier est arrivé hier. <b>À toi de l’envoyer à l’assurance avant le 01/12.</b> L’expert passe le 08/12. Un mail à l’assurance attend encore sa réponse.', a: b('Ouvrir le sujet', 1, 'sinistre') };
    if (/passeport/.test(x)) return { t: 'Passeport : la pré-demande est faite. Il reste à <b>prendre le rendez-vous en mairie avant le 01/12</b>.', a: b('Ouvrir le sujet', 1, 'passeport') };
    if (/tourne|routine|hermes|cours|sortie|week/.test(x)) return { t: 'Six routines chez Hermes, passerelle active. Cinq vont bien, une est en erreur (Bilan de la semaine, relance à 17 h 40). Prochain passage : Sorties du week-end, ce soir à 19 h.', a: '<button class="b b2 sm" data-act="file" data-f="1">Voir « En cours »</button>' };
    return { t: 'Maquette : je n’ai que quelques réponses d’exemple. Essaie « Où en est mon CRA du mois ? » ou « Qu’est-ce qui est en erreur ? ».' };
  }
  function envoyer() {
    var x = q.value.trim(); if (!x) return;
    ouvrir(); clearInterval(T.dic); q.value = ''; maj();
    S.fil.push({ m: 1, t: x }, { w: 1 }); etatP('pense'); filR();
    setTimeout(function () { var r = repondre(x); S.fil.pop(); S.fil.push({ m: 0, t: r.t, a: r.a }); etatP('parle'); filR(); setTimeout(function () { if (S.parl) etatP('pret'); }, 1400); }, calme ? 50 : 950);
  }
  function dicter() {
    ouvrir(); etatP('ecoute'); q.value = ''; maj();
    var ph = SUG[0], i = 0; clearInterval(T.dic);
    T.dic = setInterval(function () { i += 2; q.value = ph.slice(0, i); if (i >= ph.length) { clearInterval(T.dic); setTimeout(envoyer, 450); } }, calme ? 5 : 55);
  }
  function index() {
    var l = [];
    DEC.forEach(function (d) { if (S.dec[d.id] === 'att') l.push([d.t, 'à trancher', 0, d.id]); });
    chaines().forEach(function (c) { l.push([c.n, 'chaîne', 1, c.id]); });
    sujets().forEach(function (c) { l.push([c.n, 'sujet', 1, c.id]); c.st.forEach(function (s) { l.push([s.l, c.n, 1, c.id]); }); });
    ROUT.forEach(function (r) { l.push([r.n, 'routine d’Hermes', 1, r.id]); });
    MAILS.forEach(function (m) { l.push([m.n, 'mail envoyé', 1, m.id]); });
    JOURS.forEach(function (j) { j.ev.forEach(function (e) { if (e.ty !== 'pas') l.push([e.t, j.c + ' ' + j.n, 2, j.k]); }); });
    DOCS.forEach(function (d) { l.push([d[0], 'papier', -1, 'papiers']); });
    [['Aspirateur balai', 'prix suivi', 'achats'], ['Casque audio', 'prix suivi', 'achats'], ['Électricité', 'prélèvement', 'argent'], ['Lisbonne', 'voyage en projet', 'sorties'], ['Marché de Noël du centre', 'sortie', 'sorties'], ['Carte d’identité', 'papier · expire dans 5 mois', 'papiers']].forEach(function (x) { l.push([x[0], x[1], -1, x[2]]); });
    return l;
  }
  function norm(s) { return s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/['’]/g, ' '); }
  function maj() {
    var x = q.value.trim(), r = $('#res');
    $('#env').hidden = !x; $('#mic').hidden = !!x;
    if (!S.parl || x.length < 2 || cmd.classList.contains('ecoute')) { r.hidden = true; return; }
    var n = norm(x), vu = {}, l = index().filter(function (e) { var k = e[0] + e[3]; if (vu[k] || norm(e[0] + ' ' + e[1]).indexOf(n) < 0) return false; vu[k] = 1; return true; }).slice(0, 5);
    r.hidden = !l.length;
    r.innerHTML = '<h4>Trouvé dans le poste</h4>' + l.map(function (e) { return '<button data-act="' + (e[2] < 0 ? 'dom' : 'voir') + '" data-f="' + e[2] + '" data-id="' + e[3] + '"><b>' + e[0] + '</b><small>' + e[1] + '</small></button>'; }).join('');
  }
  q.addEventListener('focus', ouvrir);
  q.addEventListener('input', maj);
  cmd.addEventListener('submit', function (e) { e.preventDefault(); envoyer(); });
  $('#mic').addEventListener('click', dicter);
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') fermer(); });

  // ---- les appuis ----
  $('#app').addEventListener('click', function (ev) {
    var b = ev.target.closest('[data-act]'); if (!b) { var t = ev.target.closest('#files button'); if (t) { fermer(); file(+t.dataset.f); } return; }
    var a = b.dataset.act, id = b.dataset.id;
    if (a === 'file') { fermer(); file(+b.dataset.f); }
    else if (a === 'erreur') { var e = ROUT.filter(function (r) { return r.e === 'err'; })[0]; if (e) voir(1, e.id); else { fermer(); file(1); } }
    else if (a === 'dom') { fermer(); S.dom = S.dom === id && id !== 'tout' ? 'tout' : id; render(); $$('.file').forEach(function (f) { f.scrollTop = 0; }); var c = $('.chip[aria-pressed="true"]'); if (c && c.scrollIntoView) c.scrollIntoView({ block: 'nearest', inline: 'center' }); }
    else if (a === 'ouvrir') { S.open[id] = !S.open[id]; render(); }
    else if (a === 'oui') { var p = S.parl; oui(id); if (p) { S.fil.push({ m: 0, t: 'C’est parti. Je te préviens quand c’est déposé.' }); filR(); } }
    else if (a === 'tard') { S.dec[id] = 'tard'; render(); toast('Mis de côté. Tu le retrouves en bas de « À toi ».'); }
    else if (a === 'reprendre') { S.dec[id] = 'att'; render(); }
    else if (a === 'annuler') annuler(id);
    else if (a === 'fait') { S.fait[id] = !S.fait[id]; render(); toast(S.fait[id] ? 'Noté : c’est fait. Le sujet avance d’une étape.' : 'Remis à faire.'); }
    else if (a === 'voir') voir(+b.dataset.f, id);
    else if (a === 'jour') { var el = document.getElementById('x-' + id); if (el) { var pp = $('#f2'); pp.scrollTo({ top: el.offsetTop - pp.offsetTop - 8, behavior: calme ? 'auto' : 'smooth' }); } }
    else if (a === 'deposer') toast('Maquette : ici s’ouvre l’appareil photo ou Fichiers. JARVIS range ensuite le papier.');
    else if (a === 'sug') { q.value = b.textContent; envoyer(); }
    else if (a === 'fermer') fermer();
  });
  // la recherche de la fiche Papiers (sans tout redessiner)
  $('#app').addEventListener('input', function (ev) {
    if (ev.target.id !== 'qdoc') return;
    var n = norm(ev.target.value), box = ev.target.closest('.fiche');
    $$('.doc', box).forEach(function (d) { d.hidden = norm(d.textContent).indexOf(n) < 0; });
  });
  $('#files').addEventListener('keydown', function (e) { if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') { var i = Math.max(0, Math.min(2, S.f + (e.key === 'ArrowRight' ? 1 : -1))); file(i); $$('#files button')[i].focus(); } });

  render();
  // adresse directe pour les essais : #cours, #venir, #parler
  var hsh = location.hash.replace('#', '');
  if (hsh === 'cours') file(1, true); else if (hsh === 'venir') file(2, true);
})();
</script>
</body>
</html>
