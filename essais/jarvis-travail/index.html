<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>JARVIS · Travail</title>
<!-- Maquette (26/11/2026, sa demande : « repense comment visualiser ses routines dans JARVIS : les étapes faites, l'avancement, les dates
     d'exécution, les données prévues d'un coup d'œil ; séparer le CRA des tâches normales ; que l'UX soit bien présente » ; QCM : un espace
     « Travail » dans Espaces, « Pour moi » ne garde que ce qui attend son oui). Données inventées : aucun nom de portail, de client ni de
     personne ; rien n'est lu ni envoyé. Idées à valider : « Ce qui vient » en frise, une carte par routine (qui la fait, étapes, avancement,
     dernière et prochaine exécution, données prévues), le détail dans une feuille du bas, le bouton « Envoyer » d'un brouillon de mail. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700&family=Oxanium:wght@500;600;700&family=Exo+2:wght@400;500;600;700&display=swap">
<style>
  :root { --bg: #04060c; --fg: #e6edf7; --muted: #9fb0c8; --line: rgba(125, 211, 252, .16); --line-2: rgba(125, 211, 252, .3); --glass: rgba(15, 23, 42, .55); --glass-2: rgba(30, 41, 59, .5);
    --c1: 56, 189, 248; --c3: 168, 85, 247; --amber: #fbbf24; --red: #fca5a5; --green: #6ee7b7; --chronos: #94a3b8;
    --display: 'Oxanium', 'Exo 2', system-ui, sans-serif; --sans: 'Exo 2', system-ui, -apple-system, sans-serif; --logo: 'Orbitron', 'Oxanium', sans-serif; }
  * { box-sizing: border-box; }
  html, body { margin: 0; } html { background: #04060c; }
  body { min-height: 100vh; background: radial-gradient(120% 900px at 30% 0%, #0b1a33 0%, #060a14 45%, var(--bg) 100%) no-repeat, var(--bg); color: var(--fg); font: 15px/1.45 var(--sans); -webkit-font-smoothing: antialiased; }
  button { font: inherit; color: inherit; cursor: pointer; }
  .page { max-width: 560px; margin: 0 auto; padding: calc(env(safe-area-inset-top, 0px) + 14px) 16px calc(env(safe-area-inset-bottom, 0px) + 96px); }
  .haut { display: flex; align-items: center; gap: 10px; margin-bottom: 4px; } .retour { border: 0; background: none; color: #7dd3fc; font-weight: 600; padding: 6px 0; }
  h1 { margin: 6px 0 2px; font: 700 28px var(--display); } .sous { margin: 0 0 14px; color: var(--muted); font-size: 14px; }
  .seg { position: sticky; top: 0; z-index: 3; display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 4px; padding: 4px; margin: 0 0 16px; border-radius: 14px; background: rgba(4, 10, 28, .92); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); border: 1px solid var(--line); }
  .seg button { min-height: 38px; border: 0; border-radius: 10px; background: none; color: var(--muted); font: 600 13.5px var(--sans); white-space: nowrap; }
  .seg button[aria-pressed="true"] { color: #031022; background: linear-gradient(90deg, rgb(103, 232, 249), rgb(var(--c1))); }
  /* ce qui vient : une frise */
  .frise { display: flex; gap: 10px; overflow-x: auto; scrollbar-width: none; margin: 0 -16px 18px; padding: 2px 16px 4px; } .frise::-webkit-scrollbar { display: none; }
  .ev { flex: 0 0 auto; min-width: 150px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 16px; background: var(--glass); }
  .ev b { display: block; font: 600 13px var(--display); color: #7dd3fc; } .ev span { display: block; font-weight: 600; } .ev small { color: var(--muted); font-size: 12.5px; }
  .ev.toi { border-color: rgba(251, 191, 36, .55); } .ev.toi b { color: var(--amber); }
  h2 { display: flex; align-items: baseline; justify-content: space-between; margin: 22px 2px 10px; font: 600 12.5px var(--display); letter-spacing: .16em; text-transform: uppercase; color: #7dd3fc; }
  h2 span { font: 500 12.5px var(--sans); letter-spacing: 0; text-transform: none; color: var(--muted); }
  /* une carte par routine */
  .carte { display: block; width: 100%; margin: 0 0 12px; padding: 14px 15px; border: 1px solid var(--line); border-radius: 20px; background: linear-gradient(160deg, var(--glass-2), var(--glass)); text-align: left; }
  .carte.toi { border-color: rgba(251, 191, 36, .55); box-shadow: 0 0 0 1px rgba(251, 191, 36, .15) inset; }
  .tete { display: flex; align-items: center; gap: 8px; } .tete h3 { flex: 1; margin: 0; font: 700 17px var(--display); }
  .qui { padding: 3px 9px; border-radius: 99px; font: 600 11.5px var(--display); letter-spacing: .04em; white-space: nowrap; border: 1px solid; }
  .qui.chronos { color: var(--chronos); border-color: rgba(148, 163, 184, .45); } .qui.blanc { color: #d8b4fe; border-color: rgba(var(--c3), .55); } .qui.reel { color: #67e8f9; border-color: rgba(var(--c1), .6); background: rgba(var(--c1), .1); }
  .quand { display: flex; gap: 14px; margin: 6px 0 10px; color: var(--muted); font-size: 13px; } .quand b { color: var(--fg); font-weight: 600; }
  /* les étapes : des pastilles reliées */
  .etapes { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; align-items: start; gap: 0; margin: 4px 0 8px; }
  .et { position: relative; display: flex; flex-direction: column; align-items: center; gap: 5px; text-align: center; font-size: 11px; color: var(--muted); line-height: 1.2; min-width: 0; }
  .et i { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font-style: normal; font: 700 12px var(--display); border: 2px solid rgba(var(--c1), .35); background: #071022; color: var(--muted); z-index: 1; }
  .et::before { content: ''; position: absolute; top: 11px; left: calc(-50% + 11px); right: calc(50% + 11px); height: 2px; background: rgba(var(--c1), .25); }
  .et:first-child::before { display: none; }
  .et.fait i { border-color: var(--green); background: var(--green); color: #052e1c; } .et.fait::before { background: var(--green); } .et.fait { color: var(--fg); }
  .et.encours i { border-color: var(--amber); color: var(--amber); } .et.encours { color: var(--amber); font-weight: 600; }
  .et.bloque i { border-color: var(--red); color: var(--red); }
  .barre { height: 6px; border-radius: 99px; background: rgba(var(--c1), .13); overflow: hidden; margin: 2px 0 10px; } .barre i { display: block; height: 100%; border-radius: 99px; background: linear-gradient(90deg, rgb(var(--c1)), rgb(var(--c3))); }
  .prevu { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; } .prevu small { color: var(--muted); font-size: 12.5px; margin-right: 2px; }
  .ch { padding: 4px 8px; border-radius: 10px; font: 600 12px var(--display); background: rgba(var(--c1), .12); border: 1px solid var(--line); white-space: nowrap; }
  .ch.non { background: none; color: var(--muted); } .ch.amb { color: var(--amber); border-color: rgba(251, 191, 36, .5); }
  .der { margin: 10px 0 0; padding-top: 9px; border-top: 1px solid var(--line); color: var(--muted); font-size: 13px; } .der b { color: var(--fg); font-weight: 600; } .der .ok { color: var(--green); }
  .alerte { margin: 10px 0 0; padding: 10px 12px; border-radius: 14px; border: 1px solid rgba(251, 191, 36, .5); background: rgba(251, 191, 36, .08); font-size: 13.5px; } .alerte b { color: var(--amber); }
  .mini { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 10px; align-items: center; }
  /* la feuille du bas */
  .voile { position: fixed; inset: 0; background: rgba(2, 4, 10, .6); opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 8; } .voile.on { opacity: 1; pointer-events: auto; }
  .feuille { position: fixed; left: 0; right: 0; bottom: 0; max-height: 86vh; overflow-y: auto; z-index: 9; padding: 10px 18px calc(env(safe-area-inset-bottom, 0px) + 22px); border-radius: 24px 24px 0 0; border-top: 1px solid var(--line-2); background: linear-gradient(180deg, #0c1529, #060a14); transform: translateY(105%); transition: transform .25s ease; max-width: 560px; margin: 0 auto; }
  .feuille.on { transform: none; } .poignee { width: 44px; height: 5px; border-radius: 99px; background: rgba(255, 255, 255, .2); margin: 0 auto 12px; }
  .feuille h3 { margin: 0 0 2px; font: 700 21px var(--display); } .feuille .sous { margin-bottom: 12px; }
  .chrono { list-style: none; margin: 6px 0 14px; padding: 0; } .chrono li { position: relative; padding: 0 0 12px 26px; } .chrono li::before { content: ''; position: absolute; left: 7px; top: 18px; bottom: 0; width: 2px; background: var(--line-2); } .chrono li:last-child::before { display: none; }
  .chrono li i { position: absolute; left: 0; top: 3px; width: 16px; height: 16px; border-radius: 50%; border: 2px solid rgba(var(--c1), .4); background: #071022; }
  .chrono li.fait i { background: var(--green); border-color: var(--green); } .chrono li.encours i { border-color: var(--amber); }
  .chrono b { display: block; font-weight: 600; } .chrono small { color: var(--muted); font-size: 12.5px; }
  .mail { margin: 8px 0 12px; padding: 12px 14px; border-radius: 16px; border: 1px solid var(--line); background: rgba(4, 8, 20, .55); font-size: 14px; white-space: pre-line; } .mail .obj { display: block; margin-bottom: 6px; font-weight: 700; }
  .rang { display: flex; flex-wrap: wrap; gap: 8px; }
  .btn { display: inline-flex; align-items: center; justify-content: center; min-height: 42px; padding: 0 16px; border: 1px solid var(--line-2); border-radius: 99px; background: var(--glass); font-weight: 600; }
  .btn.main { border: 0; background: linear-gradient(90deg, #0ea5e9, #a855f7); color: #fff; }
  .hist { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 6px 10px; font-size: 13.5px; align-items: center; } .hist span { color: var(--muted); } .hist em { font-style: normal; font: 600 12px var(--display); }
  .note { color: var(--muted); font-size: 12.5px; margin: 26px 2px 0; }
</style>
</head>
<body>
<main class="page">
  <div class="haut"><button class="retour" type="button">‹ Espaces</button></div>
  <h1>Travail</h1>
  <p class="sous">Tes CRA, tes notes de frais et tes jours : qui s'en occupe, où ça en est, ce qui vient.</p>
  <div class="seg" role="group" aria-label="Filtre">
    <button type="button" aria-pressed="true" data-f="tout">Tout</button><button type="button" aria-pressed="false" data-f="cra">CRA</button><button type="button" aria-pressed="false" data-f="frais">Notes de frais</button><button type="button" aria-pressed="false" data-f="jours">Jours</button>
  </div>

  <h2>Ce qui vient <span>7 prochains jours</span></h2>
  <div class="frise" id="frise"></div>

  <div id="liste"></div>
  <p class="note">Maquette, données inventées. Rien n'est lu ni envoyé. Un appui sur une carte ouvre son détail.</p>
</main>
<div class="voile" id="voile"></div>
<section class="feuille" id="feuille" aria-modal="true" role="dialog"></section>
<script>
/* données inventées (une semaine type) */
const R = [
  {id: 'semaine', bloc: 'cra', titre: 'CRA de la semaine', qui: 'reel', quiDit: 'Hermes · réel', portail: 'portail du client',
    prochaine: 'ven. 27/11 · 12 h', derniere: {quand: 'ven. 20/11', quoi: 'soumis', par: 'Chronos', ok: true},
    etapes: [['Bilan du vendredi', 'fait'], ['Ton oui', 'encours'], ['Saisie et Save', ''], ['Submit', ''], ['Vérifié par toi', '']],
    prevu: {texte: 'Semaine du 23 au 27', jours: [['lun', 'rien', 'non'], ['mar', '1'], ['mer', '1'], ['jeu', '1'], ['ven', '1']]},
    toi: 'Ton oui attend : confirme la semaine, Hermes saisit et soumet.',
    chrono: [['Ven. 27/11, 12 h 00', 'JARVIS a lu ton agenda : 4 jours travaillés, rien le lundi (congé).', 'fait'], ['En attente', 'Ton oui dans « Pour moi » ou ici.', 'encours'], ['Ensuite (5 min)', 'Hermes saisit « 1 » sur 4 jours, « Save », relit, « Submit ».', ''], ['Après', 'Compte rendu et notification. Première fois : vérifie sur le portail.', '']],
    hist: [['20/11', 'Chronos', 'soumis, approuvé'], ['13/11', 'Chronos', 'soumis, approuvé'], ['06/11', 'Chronos', 'soumis, approuvé']], actions: [['Confirmer et soumettre', 'main'], ['Corriger', '']]},
  {id: 'mois', bloc: 'cra', titre: 'CRA du mois', qui: 'chronos', quiDit: 'Chronos', portail: 'intranet de portage',
    prochaine: 'jeu. 26/11 · 12 h', derniere: {quand: '26/10', quoi: 'validé, en attente', par: 'Chronos', ok: true},
    etapes: [['Jours validés (24)', 'fait'], ['Mail au client', 'fait'], ['CRA saisi (26)', 'encours'], ['CRA du client reçu', ''], ['Rattaché', ''], ['Validé', '']],
    prevu: {texte: 'Novembre', puces: [['17 jours travaillés', ''], ['3 congés', 'non'], ['1 férié', 'non']]},
    alerte: '<b>Fin de mission le 30/11.</b> Sans prolongation, pas de CRA en décembre. Le mail à ta chargée de mission est prêt.',
    chrono: [['Mar. 24/11, 12 h', 'Tes congés validés dans JARVIS.', 'fait'], ['Mar. 24/11, 12 h 05', 'Brouillon « CRA Novembre 2026 » au client, envoyé par toi.', 'fait'], ['Jeu. 26/11, 12 h', 'Saisie et validation du CRA (statut « en attente ») ; date de fin relevée.', 'encours'], ['Dès sa réponse', 'Son CRA en PDF reçu, puis rattaché sur l’intranet (onglet du haut de la page du CRA).', ''], ['Puis', 'Validation définitive.', '']],
    mail: {obj: 'Prolongation mission (client)', corps: 'Bonjour,\n\nJ’espère que tu vas bien !\nJe vois sur l’intranet que ma mission se termine le 30/11/2026. Est-ce possible de la prolonger d’au moins 3 mois ?\n\nMerci d’avance !\nCordialement,'},
    hist: [['26/10', 'Chronos', 'validé, en attente'], ['24/10', 'Chronos', 'mail au client'], ['28/09', 'Chronos', 'validé définitivement']], actions: [['Envoyer', 'main'], ['Modifier', '']]},
  {id: 'claude', bloc: 'frais', titre: 'Abonnement d’IA', qui: 'blanc', quiDit: 'Hermes · à blanc', prochaine: 'le 21/12', derniere: {quand: '18/11', quoi: 'créée, conforme', par: 'Chronos', ok: true},
    etapes: [['Facture', 'fait'], ['Champs', 'fait'], ['Comparé', 'fait'], ['Bascule', 'encours']], prevu: {texte: 'Décembre', puces: [['facture du mois', ''], ['catégorie Achat', 'non']]},
    chrono: [['25/11', 'À blanc : identique à la dépense de Chronos, champ par champ.', 'fait'], ['À faire', 'Déclenchement à l’arrivée de la facture, puis bascule (Chronos en pause).', 'encours']],
    hist: [['18/11', 'Chronos', 'créée, conforme'], ['25/11', 'Hermes', 'à blanc, identique']]},
  {id: 'box', bloc: 'frais', titre: 'Box internet', qui: 'blanc', quiDit: 'Hermes · à blanc', prochaine: 'le 15/12', derniere: {quand: '15/11', quoi: 'créée, conforme', par: 'Chronos', ok: true},
    etapes: [['Facture', 'fait'], ['Champs', 'fait'], ['Comparé', 'fait'], ['Bascule', 'encours']], prevu: {texte: 'Le 15/12', puces: [['facture de novembre', ''], ['moitié remboursée', 'non']]},
    chrono: [['25/11', 'Facture téléchargée sur l’espace client, à blanc : identique à Chronos.', 'fait'], ['À faire', 'Déclenchement le 15, puis bascule.', 'encours']],
    hist: [['15/11', 'Chronos', 'créée, conforme'], ['25/11', 'Hermes', 'à blanc, identique']]},
  {id: 'teletravail', bloc: 'frais', titre: 'Télétravail', qui: 'chronos', quiDit: 'Chronos', prochaine: 'le 30/11 (dernier jour)', derniere: {quand: '01/11', quoi: 'créée, remboursée', par: 'Chronos', ok: true},
    etapes: [['Jours', 'fait'], ['Électricité', ''], ['Charges', ''], ['PDF', ''], ['À blanc', '']], prevu: {texte: 'Novembre', puces: [['9 jours de télétravail', ''], ['5 pièces', 'non']]},
    chrono: [['25/11', 'Espace client de l’électricité : connexion faite, factures trouvées.', 'fait'], ['À faire', 'Pièces de Drive, synthèse en PDF, montants, à blanc.', '']],
    hist: [['01/11', 'Chronos', 'octobre, remboursée']]},
  {id: 'jours', bloc: 'jours', titre: 'Jours de novembre', qui: 'reel', quiDit: 'JARVIS', prochaine: 'le 30/11 · relu', derniere: {quand: '24/11', quoi: 'congés validés', par: 'toi', ok: true},
    etapes: [['Bilan (24)', 'fait'], ['Ton oui', 'fait'], ['Lieux notés', 'encours'], ['Relu (30)', '']], prevu: {texte: 'Lieu à venir', jours: [['jeu 26', '?', 'amb'], ['ven 27', '?', 'amb'], ['lun 30', '?', 'amb']]},
    chrono: [['24/11, 12 h', 'Bilan envoyé.', 'fait'], ['24/11', 'Tes congés validés.', 'fait'], ['Chaque jour, 11 h', 'Ton raccourci note le lieu.', 'encours'], ['30/11, 12 h', 'Relu : rien si tout est noté.', '']],
    hist: [['24/11', 'toi', 'congés validés']]}
];
const FRISE = [['jeu. 26', 'CRA du mois', 'Chronos saisit et valide', ''], ['ven. 27', 'CRA de la semaine', 'ton oui, puis Hermes', 'toi'], ['lun. 30', 'Jours relus', 'JARVIS', ''], ['lun. 30', 'Télétravail', 'Chronos (le 1er)', ''], ['15/12', 'Box internet', 'Hermes à blanc', '']];
const $ = (s) => document.querySelector(s), esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));
let F = 'tout';
function rendre() {
  $('#frise').innerHTML = FRISE.filter((e) => F === 'tout' || (F === 'cra' && /CRA/.test(e[1])) || (F === 'frais' && /Box|IA|Télétravail/.test(e[1])) || (F === 'jours' && /Jours/.test(e[1])))
    .map((e) => `<div class="ev ${e[3]}"><b>${esc(e[0])}</b><span>${esc(e[1])}</span><small>${esc(e[2])}</small></div>`).join('');
  const blocs = [['cra', 'CRA', 'la semaine et le mois'], ['frais', 'Notes de frais', 'créées le jour dit'], ['jours', 'Jours du mois', 'agenda « Présence »']];
  $('#liste').innerHTML = blocs.filter((b) => F === 'tout' || F === b[0]).map((b) => `<h2>${b[1]} <span>${b[2]}</span></h2>` + R.filter((r) => r.bloc === b[0]).map(carte).join('')).join('');
  document.querySelectorAll('.carte').forEach((c) => c.addEventListener('click', () => ouvrir(c.dataset.id)));
}
function etapes(r) {
  const n = r.etapes.filter((e) => e[1] === 'fait').length;
  return `<div class="etapes">${r.etapes.map((e, i) => `<div class="et ${e[1]}"><i>${e[1] === 'fait' ? '✓' : i + 1}</i>${esc(e[0])}</div>`).join('')}</div><div class="barre"><i style="width:${Math.round(100 * n / r.etapes.length)}%"></i></div>`;
}
function prevu(r) {
  const p = r.prevu; if (!p) return '';
  const puces = p.jours ? p.jours.map((j) => `<span class="ch ${j[2] || ''}">${esc(j[0])} · ${esc(j[1])}</span>`) : p.puces.map((x) => `<span class="ch ${x[1]}">${esc(x[0])}</span>`);
  return `<div class="prevu"><small>${esc(p.texte)} :</small>${puces.join('')}</div>`;
}
function carte(r) {
  return `<button type="button" class="carte ${r.toi ? 'toi' : ''}" data-id="${r.id}">
    <div class="tete"><h3>${esc(r.titre)}</h3><span class="qui ${r.qui}">${esc(r.quiDit)}</span></div>
    <div class="quand"><span>Prochaine : <b>${esc(r.prochaine)}</b></span></div>
    ${etapes(r)}${prevu(r)}
    ${r.alerte ? `<div class="alerte">${r.alerte}</div>` : ''}
    ${r.toi ? `<div class="alerte"><b>À toi :</b> ${esc(r.toi)}</div>` : ''}
    <p class="der">Dernière : <b>${esc(r.derniere.quand)}</b> · ${esc(r.derniere.quoi)} <span class="${r.derniere.ok ? 'ok' : ''}">●</span> par ${esc(r.derniere.par)}</p>
  </button>`;
}
function ouvrir(id) {
  const r = R.find((x) => x.id === id);
  $('#feuille').innerHTML = `<div class="poignee"></div><h3>${esc(r.titre)}</h3><p class="sous">${esc(r.quiDit)}${r.portail ? ' · ' + esc(r.portail) : ''} · prochaine : ${esc(r.prochaine)}</p>
    ${etapes(r)}${prevu(r)}
    ${r.alerte ? `<div class="alerte">${r.alerte}</div>` : ''}
    ${r.mail ? `<div class="mail"><span class="obj">${esc(r.mail.obj)}</span>${esc(r.mail.corps)}</div>` : ''}
    ${r.actions ? `<div class="rang">${r.actions.map((a) => `<button type="button" class="btn ${a[1]}">${esc(a[0])}</button>`).join('')}</div>` : ''}
    <h2>Déroulé</h2><ol class="chrono">${r.chrono.map((c) => `<li class="${c[2]}"><i></i><b>${esc(c[0])}</b><small>${esc(c[1])}</small></li>`).join('')}</ol>
    <h2>Dernières exécutions</h2><div class="hist">${r.hist.map((h) => `<b>${esc(h[0])}</b><span>${esc(h[1])}</span><em>${esc(h[2])}</em>`).join('')}</div>`;
  $('#feuille').classList.add('on'); $('#voile').classList.add('on');
}
$('#voile').addEventListener('click', () => { $('#feuille').classList.remove('on'); $('#voile').classList.remove('on'); });
document.querySelectorAll('.seg button').forEach((b) => b.addEventListener('click', () => { F = b.dataset.f; document.querySelectorAll('.seg button').forEach((x) => x.setAttribute('aria-pressed', String(x === b))); rendre(); }));
rendre();
if (/[?&]ouvrir=(\w+)/.test(location.search)) ouvrir(location.search.match(/[?&]ouvrir=(\w+)/)[1]);
</script>
</body>
</html>
